<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ฮูกติวครู</title>
<meta name="description" content="ระบบฝึกทำข้อสอบใบประกอบวิชาชีพครู (วิชาครู) สำหรับครอบครัว">
<meta name="theme-color" content="#7C5CFF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>:root{
  --bg:#F4F0FF; --bg2:#FFF6FB; --paper:#FFFFFF; --ink:#2B2340; --muted:#6F6690; --line:#2B2340; --soft:#ECE6FB; --soft2:#F7F4FF;
  --pri:#7C5CFF; --pri-ink:#FFFFFF; --pri-soft:#E7E0FF; --pink:#FF7AA8; --ok:#1FAF7A; --ok-soft:#DDF7EC; --bad:#FF5A6E; --bad-soft:#FFE6EA; --warn:#FFB020; --warn-soft:#FFF2D6;
  --d1:#F2557E; --d1t:#FFE3EC; --d2:#F08C1B; --d2t:#FFEBD2; --d3:#16A87E; --d3t:#D7F5EA; --d4:#2E86DE; --d4t:#DCEBFF; --d5:#8A5CF0; --d5t:#EDE4FF;
  --sh:0 4px 0 var(--line); --sh-sm:0 3px 0 var(--line); --r:22px; --r-sm:14px;
  --fd:"Itim","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --fb:"IBM Plex Sans Thai Looped","Sarabun","Tahoma",system-ui,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1); --ease-out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#1A1626; --bg2:#1E1830; --paper:#262036; --ink:#F3EEFF; --muted:#B4AACF; --line:#0D0A15; --soft:#332B48; --soft2:#2C253F;
  --pri:#9A80FF; --pri-soft:#3A2F66; --ok:#3FD39C; --ok-soft:#173A2E; --bad:#FF7C8C; --bad-soft:#40202A; --warn:#FFC24D; --warn-soft:#3F3218;
  --d1:#FF7FA0; --d1t:#44202E; --d2:#FFAD4D; --d2t:#43301A; --d3:#43D1A3; --d3t:#173B30; --d4:#62A8F0; --d4t:#1A3048; --d5:#AE8CFF; --d5t:#30254D;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#1A1626; --bg2:#1E1830; --paper:#262036; --ink:#F3EEFF; --muted:#B4AACF; --line:#0D0A15; --soft:#332B48; --soft2:#2C253F;
  --pri:#9A80FF; --pri-soft:#3A2F66; --ok:#3FD39C; --ok-soft:#173A2E; --bad:#FF7C8C; --bad-soft:#40202A; --warn:#FFC24D; --warn-soft:#3F3218;
  --d1:#FF7FA0; --d1t:#44202E; --d2:#FFAD4D; --d2t:#43301A; --d3:#43D1A3; --d3t:#173B30; --d4:#62A8F0; --d4t:#1A3048; --d5:#AE8CFF; --d5t:#30254D;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 12% 8%,var(--bg2) 0 180px,transparent 181px),radial-gradient(circle at 92% 30%,var(--bg2) 0 120px,transparent 121px);background-attachment:fixed;color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--fd);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 110px;min-height:100%}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;margin-inline:-16px;padding-inline:16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:22px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0}
.brand svg{width:40px;height:40px}
.top .sp{flex:1}
.demo-pill{font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:1px 10px}
.topnav{display:none;gap:6px}
.topnav button{border:2px solid transparent;background:none;border-radius:99px;padding:5px 14px;font-family:var(--fd);font-size:17px;color:var(--muted);transition:all .25s var(--ease)}
.topnav button.on{border-color:var(--line);background:var(--paper);color:var(--ink);box-shadow:var(--sh-sm)}
@media (min-width:760px){.topnav{display:flex}.bnav{display:none!important}.app{padding-block-end:40px}}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.bnav .inner{pointer-events:auto;display:flex;gap:2px;background:var(--paper);border:2.5px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:6px;max-width:520px;width:100%}
.bnav button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:1px;padding:6px 2px;border-radius:18px;font-size:12px;font-weight:600;color:var(--muted);transition:background .3s var(--ease),color .3s var(--ease),transform .3s var(--spring)}
.bnav button svg{width:24px;height:24px}
.bnav button.on{background:var(--pri-soft);color:var(--ink)}
.bnav button.on svg{transform:translateY(-1px) scale(1.08)}
.bnav button:active{transform:scale(.92)}
body.focus .bnav,body.focus .topnav{display:none!important}
/* views & transitions */
#view{position:relative}
.view{display:grid;gap:16px;padding-top:6px;transition:opacity .32s var(--ease),transform .32s var(--ease)}
.view.entering{opacity:0;transform:translateY(14px)}
.view.leaving{position:absolute;inset:0 0 auto 0;opacity:0;transform:translateY(-10px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.view,.view.entering,.view.leaving{transition:none;transform:none}}
/* cards */
.card{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card.flat{box-shadow:none;border-width:2px}
.card h3{font-size:21px;display:flex;align-items:center;gap:8px}
.card h3 small{font-family:var(--fb);font-size:13px;color:var(--muted);margin-left:auto;font-weight:600}
.pop{animation:pop .5s var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--line);background:var(--paper);border-radius:16px;padding:10px 18px;font-family:var(--fd);font-size:18px;box-shadow:var(--sh-sm);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .2s;white-space:nowrap;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.sm{font-size:15px;padding:6px 12px;border-radius:12px;border-width:2px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;border:2.5px solid var(--line);background:var(--paper);box-shadow:var(--sh-sm);transition:transform .18s var(--ease)}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.iconbtn svg{width:22px;height:22px}
/* forms */
label.f{display:grid;gap:4px;font-weight:600;font-size:15px}
.in{width:100%;border:2.5px solid var(--line);border-radius:14px;background:var(--soft2);padding:10px 14px;font-size:16px;transition:background .2s,box-shadow .2s}
.in:focus{outline:none;background:var(--paper);box-shadow:0 0 0 4px var(--pri-soft)}
textarea.in{resize:vertical;min-height:84px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 14px;font-weight:600;font-size:14px;transition:all .22s var(--ease)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.dc{background:var(--t);border-color:var(--c)}
.chip.dc.on{background:var(--c);color:#fff;border-color:var(--c)}
.seg{display:flex;background:var(--soft);border:2.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px 6px;font-family:var(--fd);font-size:16px;color:var(--muted);transition:all .25s var(--ease)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.switch input{appearance:none;width:52px;height:30px;border-radius:99px;border:2.5px solid var(--line);background:var(--soft);position:relative;transition:background .25s var(--ease);flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--paper);border:2px solid var(--line);transition:transform .3s var(--spring)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(21px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:11px;border:2px solid var(--line);background:var(--paper);font-size:20px;line-height:1;display:grid;place-items:center}
.stepper input{width:56px;text-align:center;border:2px solid var(--line);border-radius:11px;padding:4px;background:var(--soft2);font-variant-numeric:tabular-nums}
/* domain colors */
.d1{--c:var(--d1);--t:var(--d1t)} .d2{--c:var(--d2);--t:var(--d2t)} .d3{--c:var(--d3);--t:var(--d3t)} .d4{--c:var(--d4);--t:var(--d4t)} .d5{--c:var(--d5);--t:var(--d5t)}
.dtag{display:inline-flex;align-items:center;gap:6px;background:var(--t);color:var(--ink);border:2px solid var(--c);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}
.dtag b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:11px}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,var(--pri-soft),var(--d1t));}
.hero .owl{width:92px;height:92px}
.hero h2{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--sh-sm)}
.kpi .v{font-family:var(--fd);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.act{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;border:2.5px solid var(--line);border-radius:20px;padding:14px;background:var(--t,var(--paper));box-shadow:var(--sh);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.act:hover{transform:translateY(-2px)}
.act:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.act .ic{width:48px;height:48px;border-radius:16px;background:var(--c,var(--pri));color:#fff;display:grid;place-items:center;border:2.5px solid var(--line)}
.act .ic svg{width:26px;height:26px}
.act b{font-family:var(--fd);font-weight:400;font-size:19px;display:block}
.act span{font-size:13px;color:var(--muted);font-weight:600}
/* bars */
.dbar{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.dbar .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:14px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--pri));border-radius:99px;transition:width 1s var(--ease-out)}
.track .pass{position:absolute;top:-2px;bottom:-2px;left:60%;width:0;border-left:2px dashed var(--ink);opacity:.6}
.dbar .pc{font-family:var(--fd);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
svg text{font-family:var(--fb)}
.chart{width:100%;height:auto;display:block}
/* advice */
.advice{display:grid;gap:10px}
.tipc{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--soft2);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.tipc .b{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--c,var(--pri));color:#fff;border:2px solid var(--line)}
.tipc .b svg{width:18px;height:18px}
.tipc p{font-size:15px}
.tipc .btn{margin-top:6px}
/* list */
.list{display:grid;gap:10px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--paper);text-align:left;width:100%;transition:transform .2s var(--ease),background .2s}
button.li:hover{background:var(--soft2)}
button.li:active{transform:scale(.99)}
.score-dot{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--fd);font-size:19px;border:2.5px solid var(--line);font-variant-numeric:tabular-nums}
.score-dot.pass{background:var(--ok-soft)} .score-dot.fail{background:var(--bad-soft)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;border:2px solid var(--line)}
.badge.ok{background:var(--ok-soft)} .badge.bad{background:var(--bad-soft)} .badge.warn{background:var(--warn-soft)} .badge.pri{background:var(--pri-soft)}
/* exam */
.exam-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.exam-top .t{font-family:var(--fd);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{display:flex;align-items:center;gap:6px;font-family:var(--fd);font-size:20px;background:var(--paper);border:2.5px solid var(--line);border-radius:14px;padding:4px 12px;box-shadow:var(--sh-sm);font-variant-numeric:tabular-nums;transition:background .3s}
.timer svg{width:20px;height:20px}
.timer.low{background:var(--bad);color:#fff;animation:pulse 1s var(--ease) infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.prog{height:12px;border:2px solid var(--line);border-radius:99px;background:var(--paper);overflow:hidden}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pri) 0 10px,color-mix(in srgb,var(--pri) 80%,#fff) 10px 20px);transition:width .5s var(--ease)}
.qwrap{position:relative;overflow:hidden;border-radius:var(--r)}
.qcard{transition:transform .34s var(--ease),opacity .34s var(--ease)}
.qcard.out-l{transform:translateX(-40px);opacity:0}.qcard.out-r{transform:translateX(40px);opacity:0}
.qcard.in-l{transform:translateX(40px);opacity:0}.qcard.in-r{transform:translateX(-40px);opacity:0}
.qno{font-family:var(--fd);font-size:17px;color:var(--muted)}
.qtext{font-size:18px;line-height:1.7;font-weight:500;white-space:pre-wrap}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;border:2.5px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--paper);box-shadow:var(--sh-sm);transition:transform .2s var(--ease),background .25s var(--ease),box-shadow .2s var(--ease);font-size:16px;line-height:1.55}
.choice .L{width:40px;height:40px;border-radius:13px;border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-size:20px;background:var(--soft);transition:all .25s var(--ease)}
.choice:hover{transform:translateY(-1px)}
.choice:active{transform:translateY(3px);box-shadow:none}
.choice.sel{background:var(--pri-soft)}
.choice.sel .L{background:var(--pri);color:#fff;transform:rotate(-6deg) scale(1.06)}
.choice.right{background:var(--ok-soft)} .choice.right .L{background:var(--ok);color:#fff}
.choice.wrong{background:var(--bad-soft)} .choice.wrong .L{background:var(--bad);color:#fff}
.choice[disabled]{cursor:default}
.choice.bump{animation:bump .42s var(--spring)}
@keyframes bump{40%{transform:scale(1.025)}}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.explain{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;background:var(--warn-soft);font-size:15px}
.explain b{font-family:var(--fd);font-weight:400;font-size:17px}
.exam-foot{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);border-radius:20px;padding:6px}
.flag.on{background:var(--warn)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.navgrid button{height:44px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.navgrid button.ans{background:var(--pri-soft)}
.navgrid button.cur{outline:3px solid var(--pri);outline-offset:1px}
.navgrid button.fl::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--line)}
.navgrid button.r{background:var(--ok-soft)} .navgrid button.w{background:var(--bad-soft)}
/* result */
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--fd);font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ring circle{transition:stroke-dashoffset 1.4s var(--ease-out)}
.res-hero{text-align:center;justify-items:center}
.verdict{font-family:var(--fd);font-size:26px}
.rv{display:grid;gap:10px;border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--paper)}
.rv .choice{box-shadow:none;padding:6px 10px;font-size:15px;grid-template-columns:32px 1fr}
.rv .choice .L{width:32px;height:32px;font-size:16px;border-radius:10px}
/* modal & toast */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(20,14,40,.45);display:grid;align-items:end;justify-items:center;padding:16px;opacity:0;transition:opacity .28s var(--ease)}
.scrim.show{opacity:1}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{width:100%;max-width:620px;max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border:2.5px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:18px;display:grid;gap:14px;transform:translateY(30px) scale(.98);transition:transform .34s var(--ease)}
.scrim.show .sheet{transform:none}
.sheet h3{font-size:22px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:200;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 16px;font-weight:600;max-width:520px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);animation:tin .35s var(--ease-out) both}
.toast.ok{background:var(--ok);color:#fff} .toast.bad{background:var(--bad);color:#fff}
.toast.out{animation:tout .3s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
/* auth */
.auth{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:24px}
.auth .card{width:100%;max-width:430px}
.auth .owl{width:130px;height:130px;margin:0 auto;display:block}
.auth h1{font-size:34px;text-align:center}
.float{animation:float 3.4s var(--ease) infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1.2em}
/* table */
.tbl{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--soft);text-align:left;padding:6px 8px;white-space:nowrap}
td{padding:6px 8px;border-top:1.5px solid var(--soft);vertical-align:top}
tr.bad td{background:var(--bad-soft)}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft) 0%,var(--soft2) 50%,var(--soft) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;border:2.5px solid var(--soft)}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;display:grid;justify-items:center;gap:8px;padding:12px}
.empty .owl{width:96px;height:96px}
.qitem{border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:6px;background:var(--paper)}
.qitem .qt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qitem.open .qt{display:block}
.qitem .more{display:none;gap:6px}
.qitem.open .more{display:grid}
.owlpick{display:flex;gap:10px;flex-wrap:wrap}
.owlpick button{width:62px;height:62px;border-radius:18px;border:2.5px solid var(--line);background:var(--soft2);padding:4px;transition:transform .25s var(--spring)}
.owlpick button.on{background:var(--pri-soft);transform:scale(1.08);box-shadow:var(--sh-sm)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
.hide{display:none!important}
h2 svg,h3 svg{width:24px;height:24px;flex:none;color:var(--pri)}
.chip svg{width:16px;height:16px;vertical-align:-3px}
.owl{width:110px;height:110px;flex:none}
.res-hero .owl{width:120px;height:120px}
.li .owl,.owlpick svg{width:100%;height:100%}
/* focus mode (exam): hide app header, keep exam bar pinned */
body.focus .top,body.focus .credit{display:none}
.exam-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);margin-inline:-16px;padding:10px 16px}
.startbar{margin-bottom:6px}
.credit{text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding-block:18px 6px}
.auth .credit{padding:0;margin-top:2px}
/* tour */
.tour{position:fixed;inset:0;z-index:300;opacity:0;transition:opacity .3s var(--ease)}
.tour.on{opacity:1}.tour.off{opacity:0}
.tour-mask{position:fixed;inset:0;width:100%;height:100%}.tour-mask path{fill:rgba(20,14,40,.58);transition:d .45s var(--ease)}
.tour-hole{position:fixed;border-radius:22px;border:3px dashed #FFD24D;transition:all .45s var(--ease);pointer-events:none}
.tour-hole.none{top:50%!important;left:50%!important;width:0!important;height:0!important;border-width:0}
.tour-tip{position:fixed;width:min(360px,calc(100vw - 24px));display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--paper);border:2.5px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:14px;opacity:0;transform:translateY(8px) scale(.97);transition:opacity .3s var(--ease),transform .35s var(--ease),top .45s var(--ease),left .45s var(--ease)}
.tour-tip.show{opacity:1;transform:none}
.tour-tip.center{top:50%!important;left:50%!important;transform:translate(-50%,-46%) scale(.97)}
.tour-tip.center.show{transform:translate(-50%,-50%)}
.tour-owl svg{width:64px;height:64px}
.tour-tip .tt{font-family:var(--fd);font-weight:400;font-size:20px;display:block;line-height:1.3}
.tour-tip .td{font-size:15px;margin-top:4px}
.tour-bar{display:flex;align-items:center;gap:4px;margin-top:10px}
.tour-bar .sp{flex:1}
.tour-bar .tn{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tour-hole,.tour-tip{transition:none}}
</style>

ation":"เด็กขั้น Preoperational ยังไม่เข้าใจหลักการอนุรักษ์ (Conservation) และตัดสินจากสิ่งที่เห็นภายนอก ความเข้าใจเรื่องการอนุรักษ์จะเกิดในขั้น Concrete Operational","difficulty":"ง่าย","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Piaget","question":"การสอนเรื่องเศษส่วนให้นักเรียนชั้น ป.3 ควรเริ่มอย่างไรจึงสอดคล้องกับทฤษฎีของ Piaget มากที่สุด","choices":["เริ่มจากสูตรและสัญลักษณ์ทางคณิตศาสตร์ทันที","ให้ท่องจำนิยามเศษส่วนก่อนลงมือทำ","ให้ตั้งสมมติฐานเกี่ยวกับเศษส่วนด้วยตนเอง","ให้แบ่งของจริง เช่น ขนมหรือกระดาษ ก่อนใช้ภาพและสัญลักษณ์"],"answer":3,"explanation":"เด็กวัยประถม (Concrete Operational) คิดได้ดีกับสิ่งที่เป็นรูปธรรม จึงควรใช้แนวทาง CPA: Concrete → Pictorial → Abstract","difficulty":"ง่าย","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Piaget","question":"นักเรียนเคยรู้ว่า 'สัตว์ที่ว่ายน้ำได้คือปลา' เมื่อเรียนว่าวาฬเป็นสัตว์เลี้ยงลูกด้วยนมจึงปรับความเข้าใจใหม่ กระบวนการนี้เรียกว่าอะไร","choices":["Accommodation","Assimilation","Equilibration","Egocentrism"],"answer":0,"explanation":"Accommodation คือการปรับโครงสร้างความรู้เดิม (Schema) ให้สอดคล้องกับข้อมูลใหม่ ส่วน Assimilation คือการรับข้อมูลใหม่เข้าไปในโครงสร้างเดิมโดยไม่ต้องปรับ","difficulty":"ปานกลาง","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Erikson","question":"นักเรียนชั้น ม.4 สับสนว่าตนเองชอบอะไรและอยากเป็นอะไรในอนาคต ตามทฤษฎีของ Erikson นักเรียนกำลังเผชิญวิกฤตขั้นใด","choices":["Identity vs. Role Confusion","Initiative vs. Guilt","Intimacy vs. Isolation","Industry vs. Inferiority"],"answer":0,"explanation":"วัยรุ่นอายุประมาณ 12–18 ปี อยู่ในขั้น Identity vs. Role Confusion คือการค้นหาอัตลักษณ์ของตนเอง","difficulty":"ง่าย","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Erikson","question":"ตามทฤษฎีของ Erikson ครูประถมศึกษาควรจัดการเรียนรู้อย่างไรเพื่อช่วยให้นักเรียนผ่านวิกฤต Industry vs. Inferiority ได้ดี","choices":["ให้งานยากเกินระดับเพื่อฝึกความอดทน","มอบงานที่ท้าทายพอเหมาะให้ทำสำเร็จ และชื่นชมความพยายามอย่างสม่ำเสมอ","ลดการให้งานเพื่อไม่ให้นักเรียนเครียด","เปรียบเทียบผลงานของนักเรียนกับเพื่อนเพื่อกระตุ หตุผล มากกว่าการตัดสินถูกผิดให้","difficulty":"ปานกลาง","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Bronfenbrenner","question":"ตามทฤษฎีระบบนิเวศของ Bronfenbrenner การประชุมร่วมกันระหว่างผู้ปกครองกับครูประจำชั้น จัดอยู่ในระบบใด","choices":["Macrosystem","Mesosystem","Exosystem","Microsystem"],"answer":1,"explanation":"Mesosystem คือปฏิสัมพันธ์ระหว่างระบบย่อยใน Microsystem เช่น ความสัมพันธ์ระหว่างบ้านกับโรงเรียน","difficulty":"ยาก","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Bandura","question":"นักเรียนเริ่มทักทายครูด้วยการไหว้หลังจากเห็นเพื่อนที่ทำเช่นนั้นได้รับคำชม อธิบายได้ด้วยทฤษฎีใด","choices":["ทฤษฎีพหุปัญญา (Gardner)","ทฤษฎีการเรียนรู้ทางสังคม (Bandura)","ทฤษฎีการวางเงื่อนไขแบบคลาสสิก (Pavlov)","ทฤษฎีลำดับขั้นความต้องการ (Maslow)"],"answer":1,"explanation":"Bandura อธิบายว่าคนเรียนรู้โดยการสังเกตตัวแบบ และการเห็นตัวแบบได้รับการเสริมแรง (Vicarious Reinforcement) ทำให้เลียนแบบพฤติกรรมนั้น","difficulty":"ง่าย","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Bandura","question":"แหล่งที่ส่งผลต่อการรับรู้ความสามารถของตนเอง (Self-efficacy) มากที่สุดตามแนวคิดของ Bandura คือข้อใด","choices":["สภาวะทางร่างกายและอารมณ์","การชักจูงด้วยคำพูดของผู้อื่น","การได้เห็นตัวแบบประสบความสำเร็จ","ประสบการณ์ความสำเร็จของตนเอง (Mastery Experience)"],"answer":3,"explanation":"Bandura ระบุ 4 แหล่งของ Self-efficacy โดยประสบการณ์ความสำเร็จของตนเองมีอิทธิพลมากที่สุด ครูจึงควรจัดงานที่ผู้เรียนทำสำเร็จได้ทีละขั้น","difficulty":"ยาก","level":"จำ/เข้าใจ"},{"domain":2,"topic":"Skinner","question":"ครูบอกว่า 'ถ้าทำแบบฝึกหัดในห้องเสร็จครบถูกต้อง คืนนี้ไม่ต้องทำการบ้านเพิ่ม' ทำให้นักเรียนตั้งใจทำงานมากขึ้น เป็นการใช้วิธีใด","choices":["การเสริมแรงทางบวก","การลงโทษทางลบ","การลงโทษทางบวก","การเสริมแรงทางลบ"],"answer":3,"explanation":"การเสริมแรงทางลบคือการถอดสิ่งที่ไม่พึงพอใจ (การบ้าน) ออก เพื่อให้พฤติกรรมที่ต้องการเพิ่มขึ้น 'การเสริมแรง' ทุกแบบทำให้พฤติกรรมเพิ่ม","difficulty":"ปานกลาง","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Skinner","question":"นักเรียนชอบพูดแทรกเพื่อเรียกร้องความสนใจ ครูจึงไม่ตอบสนองต่อการพูดแทรกนั้น แต่ชมเมื่อนักเรียนยกมือ วิธีที่ครูใช้กับการพูดแทรกคือข้อใด","choices":["การลงโทษทางบวก","การลงโทษทางลบ (Response Cost)","การเสริมแรงทางลบ","การหยุดยั้ง (Extinction)"],"answer":3,"explanation":"Extinction คือการไม่เสริมแรงพฤติกรรม จนพฤติกรรมนั้นลดลงและหายไป เหมาะกับพฤติกรรมเรียกร้องความสนใจ ร่วมกับเสริมแรงพฤติกรรมที่เหมาะสม","difficulty":"ปานกลาง","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Skinner","question":"ตารางการเสริมแรงแบบใดทำให้พฤติกรรมคงทนต่อการหยุดยั้งได้ดีที่สุด","choices":["การเสริมแรงแบบอัตราส่วนไม่คงที่ (Variable Ratio)","การเสริมแรงแบบต่อเนื่องทุกครั้ง","การเสริมแรงแบบช่วงเวลาคงที่ (Fixed Interval)","การเสริมแรงแบบอัตราส่วนคงที่ (Fixed Ratio)"],"answer":0,"explanation":"การเสริมแรงแบบไม่คงที่ โดยเฉพาะ Variable Ratio ผู้เรียนคาดเดาไม่ได้ว่าจะได้รับรางวัลเมื่อใด พฤติกรรมจึงคงทนและหายช้าที่สุด","difficulty":"ยาก","level":"จำ/เข้าใจ"},{"domain":2,"topic":"Pavlov","question":"นักเรียนรู้สึกใจสั่นทุกครั้งที่ได้ยินครูพูดว่า 'เก็บหนังสือ' เพราะเคยเจอการสอบย่อยทันทีหลังคำพูดนี้หลายครั้ง อธิบายได้ด้วยทฤษฎีใด","choices":["การเรียนรู้อย่างมีความหมาย","การเรียนรู้โดยการหยั่งรู้","การวางเงื่อนไขแบบคลาสสิก","การวางเงื่อนไขแบบการกระทำ"],"answer":2,"explanation":"Pavlov อธิบายว่าสิ่งเร้าที่เป็นกลาง (คำพูด) เมื่อเกิดคู่กับสิ่งเร้าที่ทำให้เกิดความวิตก (การสอบ) ซ้ำ ๆ จะกลายเป็นสิ่งเร้าที่วางเงื่อนไข (CS) ที่ทำให้เกิดการตอบสนองเอง","difficulty":"ปานกลาง","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Ausubel","question":"ก่อนเริ่มบทเรียนเรื่องระบบนิเวศ ครูแสดงแผนผังภาพรวมที่เชื่อมโยงหัวข้อทั้งหมดของหน่วยให้นักเรียนเห็น เป็นการใช้แนวคิดของใคร","choices":["Kolb – Experiential Learning","Ausubel – Advance Organizer","Bruner – Discovery Learning","Thorndike – Law of Exercise"],"answer":1,"explanation":"Ausubel เสนอ Advance Organizer คือการให้กรอบความรู้ล่วงหน้า เพื่อเชื่อมความรู้ใหม่กับโครงสร้างความรู้เดิม ทำให้เกิดการเรียนรู้อย่างมีความหมาย","difficulty":"ง่าย","level":"ประยุกต์ใช้"},{"domain":2,"topic":"Bruner","question":"ข้อใดเรียงลำดับขั้นการเรียนรู้ on":"แบ่งนักเรียนเป็นกลุ่มสูงและกลุ่มต่ำ กลุ่มละ 20 คน ข้อสอบข้อหนึ่งกลุ่มสูงตอบถูก 16 คน กลุ่มต่ำตอบถูก 8 คน ค่าอำนาจจำแนก (r) เท่ากับเท่าใด","choices":["0.60","0.80","0.20","0.40"],"answer":3,"explanation":"r = (Ru − RL) / n = (16 − 8) / 20 = 0.40 ซึ่งมากกว่า 0.20 ถือว่าจำแนกได้ดี","difficulty":"ปานกลาง","level":"ประยุกต์ใช้"},{"domain":4,"topic":"คุณภาพเครื่องมือวัด","question":"ข้อสอบข้อหนึ่งมีค่าอำนาจจำแนกเป็น −0.25 ครูควรดำเนินการอย่างไร","choices":["ใช้เป็นข้อสอบข้อแรกเพื่อสร้างกำลังใจ","ตัดทิ้งหรือปรับปรุงใหม่ เพราะกลุ่มอ่อนตอบถูกมากกว่ากลุ่มเก่ง","เก็บไว้ใช้ เพราะค่าอำนาจจำแนกติดลบแสดงว่าจำแนกได้ดี","เก็บไว้ใช้ เพราะเป็นข้อสอบที่ยาก"],"answer":1,"explanation":"ค่าอำนาจจำแนกติดลบหมายถึงกลุ่มอ่อนตอบถูกมากกว่ากลุ่มเก่ง แสดงว่าข้อสอบบกพร่อง ต้องตัดทิ้งหรือปรับปรุง (ควรมีค่าตั้งแต่ 0.20 ขึ้นไป)","difficulty":"ปานกลาง","level":"วิเคราะห์/ประเมินค่า"},{"domain":4,"topic":"คุณภาพเครื่องมือวัด","question":"การหาค่าความเที่ยงของแบบสอบถามมาตรประมาณค่า 5 ระดับ ควรใช้วิธีใด","choices":["ดัชนี IOC","KR-20","สัมประสิทธิ์แอลฟาของครอนบาค (Cronbach's Alpha)","ค่าอำนาจจำแนกแบบ 27%"],"answer":2,"explanation":"Cronbach's Alpha ใช้กับเครื่องมือที่ให้คะแนนแบบหลายระดับ เช่น มาตรประมาณค่า ส่วน KR-20/KR-21 ใช้กับข้อสอบที่ตรวจให้คะแนนแบบ 0–1 และ IOC เป็นการหาความตรง","difficulty":"ปานกลาง","level":"จำ/เข้าใจ"},{"domain":4,"topic":"เครื่องมือและวิธีการวัด","question":"ข้อใดเป็นหลักการเขียนข้อสอบแบบเลือกตอบที่ถูกต้อง","choices":["ควรใช้ตัวเลือก 'ถูกทุกข้อ' บ่อย ๆ เพื่อเพิ่มความยาก","ตัวเลือกที่ถูกควรยาวกว่าตัวเลือกอื่นเพื่อความชัดเจน","ตัวลวงต้องมีความเป็นไปได้ และตัวเลือกควรยาวใกล้เคียงกัน","ควรใช้คำปฏิเสธซ้อนเพื่อวัดความรอบคอบ"],"answer":2,"explanation":"หลักการเขียนข้อสอบเลือกตอบ: คำถามชัดเจน ตัวลวงเป็นไปได้ ตัวเลือกยาวใกล้เคียงกัน หลีกเลี่ยง 'ถูกทุกข้อ/ผิดทุกข้อ' และไม่ใช้คำปฏิเสธซ้อน","difficulty":"ง่าย","level":"จำ/เข้าใจ"},{"domain":4,"topic":"เครื่องมือและวิธีการวัด","question":"ครูต้องการประเมินงานเขียนเรียงความเพื่อให้ข้อมูลย้อนกลับว่านักเรียนควรพัฒนาด้านใดบ้าง เช่น การใช้ภาษา การเรียบเรียง และเนื้อหา ควรใช้เครื่องมือใดเหมาะสมที่สุด","choices":["เกณฑ์การให้คะแนนแบบแยกองค์ประกอบ (Analytic Rubric)","เกณฑ์การให้คะแนนแบบองค์รวม (Holistic Rubric)","แบบตรวจสอบรายการ (Checklist) แบบมี-ไม่มี","แบบทดสอบแบบเลือกตอบ"],"answer":0,"explanation":"Analytic Rubric แยกเกณฑ์ย่อยหลายด้าน จึงให้ข้อมูลย้อนกลับเพื่อพัฒนาได้ละเอียด ส่วน Holistic Rubric ให้คะแนนภาพรวม เหมาะกับการตัดสินอย่างรวดเร็ว","difficulty":"ปานกลาง","level":"วิเคราะห์/ประเมินค่า"},{"domain":4,"topic":"เครื่องมือและวิธีการวัด","question":"องค์ประกอบที่สำคัญซึ่งต้องมีในแฟ้มสะสมงาน (Portfolio) ที่มีคุณภาพคือข้อใด","choices":["การสะท้อนคิดของผู้เรียนต่อชิ้นงาน","ใบประกาศนียบัตรที่ได้รับ","คะแนนสอบปลายภาค","ชิ้นงานทุกชิ้นที่ผู้เรียนเคยทำ"],"answer":0,"explanation":"แฟ้มสะสมงานไม่ใช่เพียงที่เก็บงาน แต่ต้องมีการคัดเลือกชิ้นงานและ 'การสะท้อนคิดของผู้เรียน' เพื่อแสดงพัฒนาการและการรู้คิด","difficulty":"ปานกลาง","level":"จำ/เข้าใจ"},{"domain":4,"topic":"เครื่องมือและวิธีการวัด","question":"ครูจดบันทึกเหตุการณ์พฤติกรรมสำคัญของนักเรียนที่สังเกตเห็นโดยบรรยายตามสภาพจริง พร้อมวันเวลา เป็นการใช้เครื่องมือใด","choices":["แบบสัมภาษณ์แบบมีโครงสร้าง","ระเบียนพฤติการณ์ (Anecdotal Record)","มาตรประมาณค่า (Rating Scale)","แบบตรวจสอบรายการ (Checklist)"],"answer":1,"explanation":"ระเบียนพฤติการณ์คือการบันทึกเหตุการณ์หรือพฤติกรรมที่สังเกตได้อย่างเป็นข้อเท็จจริง ส่วน Checklist เป็นการตรวจว่ามี/ไม่มี และ Rating Scale ให้ระดับคุณภาพ","difficulty":"ปานกลาง","level":"จำ/เข้าใจ"},{"domain":4,"topic":"สถิติพื้นฐาน","question":"คะแนนสอบของห้องหนึ่งมีค่าเฉลี่ย 60 ส่วนเบี่ยงเบนมาตรฐาน 10 นักเรียนที่ได้ 75 คะแนน มีคะแนนมาตรฐาน Z และ T เท่าใด","choices":["Z = 1.5 และ T = 15","Z = 15 และ T = 65","Z = 0.75 และ T = 57.5","Z = 1.5 และ T = 65"],"answer":3,"explanation":"Z = (x − x̄) / S = (75 − 60) / 10 = 1.5 และ T = 50 + 10Z = 50 + 15 = 65","difficulty":"ปานกลาง","level":"ประยุกต์ใช้"},{"domain":4,"topic":"สถิติพื้นฐาน","question":"ห้อง ก และห้อง ข มีคะแนนเฉลี่ยเท่ากัน แต่ห้อง ก มีส่วนเบี่ยงเบนมาตรฐานสูงกว่าห้อง ข มาก แปลความได้อย function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h? h+":"+String(m).padStart(2,"0") : m)+":"+String(s).padStart(2,"0"); }
function fmtDur(sec){ const m=Math.round(sec/60); if(m<1) return Math.round(sec)+" วินาที"; if(m<60) return m+" นาที"; return Math.floor(m/60)+" ชม. "+(m%60)+" นาที"; }
function fmtDate(ms){ try{ return new Date(ms).toLocaleString("th-TH",{day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return new Date(ms).toISOString().slice(0,16); } }

async function sha(s){ try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return "p:"+s; } }

/* ---------- toast & modal ---------- */
function toast(msg, type=""){
  let box=$(".toasts"); if(!box){ box=h('<div class="toasts" role="status" aria-live="polite"></div>'); document.body.append(box); }
  const t=h(`<div class="toast ${type}">${esc(msg)}</div>`); box.append(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),320); }, type==="bad"?4200:2600);
}
function modal({title="", body="", actions=[{k:"ok",t:"ตกลง",c:"pri"}], onOpen, dismiss=true}){
  return new Promise(res=>{
    const sc=h(`<div class="scrim" role="dialog" aria-modal="true"><div class="sheet"><h3>${title}</h3><div class="mb"></div><div class="acts"></div></div></div>`);
    const mb=$(".mb",sc); if(typeof body==="string") mb.innerHTML=body; else mb.append(body);
    const close=(k)=>{ sc.classList.remove("show"); setTimeout(()=>sc.remove(),300); document.removeEventListener("keydown",onKey); res(k); };
    const onKey=e=>{ if(e.key==="Escape" && dismiss) close(null); };
    actions.forEach(a=>{ const b=h(`<button class="btn ${a.c||""}">${a.t}</button>`); b.onclick=async()=>{ if(a.run){ const ok=await a.run(sc); if(ok===false) return; } close(a.k); }; $(".acts",sc).append(b); });
    if(dismiss) sc.addEventListener("click",e=>{ if(e.target===sc) close(null); });
    document.addEventListener("keydown",onKey);
    document.body.append(sc); requestAnimationFrame(()=>requestAnimationFrame(()=>sc.classList.add("show")));
    onOpen && onOpen(sc, close);
  });
}
const confirmBox = (title, text, okText="ยืนยัน", cls="bad") => modal({title, body:`<p>${text}</p>`, actions:[{k:null,t:"ยกเลิก",c:"ghost"},{k:"ok",t:okText,c:cls}]}).then(k=>k==="ok");

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=h('<canvas id="confetti"></canvas>'); document.body.append(c);
  const x=c.getContext("2d"); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=["#F2557E","#F08C1B","#16A87E","#2E86DE","#8A5CF0","#FFB547"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*120,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0; (function tick(){ x.clearRect(0,0,W,H); P.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }); if(++f<150) requestAnimationFrame(tick); else c.remove(); })();
}

class FirebaseStore {
  constructor(){
    this.kind="firebase";
    firebase.initializeApp(FB_CONFIG);
    this.auth=firebase.auth(); this.db=firebase.firestore();
    try{ this.db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
    this._pending=null;
  }
  onAuth(cb){ this.auth.onAuthStateChanged(async u=>{ if(!u) return cb(null); if(this._pending) await this._pending; try{ cb(await this._user(u)); }catch(e){ console.error(e); cb({uid:u.uid, username:u.email.split("@")[0], displayName:u.email.split("@")[0], avatar:0, admin:false}); } }); }
  async _user(u){
    const ref=this.db.doc("users/"+u.uid); const s=await ref.get();
    let p=s.exists? s.data() : null;
    if(!p){ const un=u.email.split("@")[0]; p={username:un, displayName:un, avatar:0, createdAt:Date.now()}; await ref.set(p); }
    return {uid:u.uid, ...p, admin: await this.isAdmin(u.uid)};
  }
  async isAdmin(id){ try{ const s=await this.db.doc("config/admins").get(); return s.exists && (s.data().uids||[]).includes(id); }catch(e){ return false; } }
  async admins(){ const s=await this.db.doc("config/admins").get(); return s.exists? (s.data().uids||[]) : []; }
  async signUp(username,password,displayName){
    let done; this._pending=new Promise(r=>done=r);
    try{
      const cred=await this.auth.createUserWithEmailAndPassword(toEmail(username), password);
      const id=cred.user.uid;
      await this.db.doc("users/"+id).set({username, displayName:displayName||username, avatar:0, createdAt:Date.now()});
      try{ await this.db.runTransaction(async t=>{ const ref=this.db.doc("config/admins"); const s=await t.get(ref); if(!s.exists) t.set(ref,{uids:[id]}); }); }catch(e){ /* มีผู้ดูแลแล้ว */ }
    } finally { done(); this._pending=null; }
  }
  signIn(u,p){ return this.auth.signInWithEmailAndPassword(toEmail(u), p); }
  signOut(){ return this.auth.signOut(); }
  async changePassword(oldP,newP){ const u=this.auth.currentUser; const cred=firebase.auth.EmailAuthProvider.credential(u.email, oldP); await u.reauthenticateWithCredential(cred); await u.updatePassword(newP); }
  updateProfile(id,data){ return this.db.doc("users/"+id).set(data,{merge:true}); }
  async listQuestions(){ const s=await this.db.collection("questions").get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
  async addQuestions(list, by, onProg){
    let n=0;
    for(let i=0;i<list.length;i+=400){
      const b=this.db.batch();
      list.slice(i,i+400).forEach(q=>{ b.set(this.db.collection("questions").doc(), {...q, createdAt:Date.now(), createdBy:by}); });
      await b.commit(); n=Math.min(list.length,i+400); onProg&&onProg(n,list.length);
    }
  }
  updateQuestion(id,data){ return this.db.doc("questions/"+id).set(data,{merge:true}); }
  async deleteQuestions(ids, onProg){ for(let i=0;i<ids.length;i+=400){ const b=this.db.batch(); ids.slice(i,i+400).forEach(id=>b.delete(this.db.doc("questions/"+id))); await b.commit(); onProg&&onProg(Math.min(ids.length,i+400),ids.length); } }
  async listExams(){ const s=await this.db.collection("exams").get(); return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); }
  async saveExam(e){ const {id,...d}=e; if(id) await this.db.doc("exams/"+id).set(d); else await this.db.collection("exams").add(d); }
  deleteExam(id){ return this.db.doc("exams/"+id).delete(); }
  async saveAttempt(id, sum, detail){
    const b=this.db.batch();
    b.set(this.db.doc(`users/${id}/attempts/${sum.id}`), sum);
    b.set(this.db.doc(`users/${id}/attemptDetails/${sum.id}`), detail);
    await b.commit();
  }
  async listAttempts(id){ const s=await this.db.collection(`users/${id}/attempts`).orderBy("createdAt","desc").limit(300).get(); return s.docs.map(d=>d.data()); }
  async getDetail(id, aid){ const s=await this.db.doc(`users/${id}/attemptDetails/${aid}`).get(); return s.exists? s.data() : null; }
  async deleteAttempt(id, aid){ const b=this.db.batch(); b.delete(this.db.doc(`users/${id}/attempts/${aid}`)); b.delete(this.db.doc(`users/${id}/attemptDetails/${aid}`)); await b.commit(); }
  async listUsers(){ const s=await this.db.collection("users").get(); return s.docs.map(d=>({uid:d.id,...d.data()})); }
  async setAdmin(id,on){ const ref=this.db.doc("config/admins"); await ref.update({uids: on? firebase.firestore.FieldValue.arrayUnion(id) : firebase.firestore.FieldValue.arrayRemove(id)}); }
}

/* โหมดทดลอง: เก็บข้อมูลในเบราว์เซอร์เครื่องนี้ */
class LocalStore {
  constructor(){ this.kind="local"; this.K="hkt_local_v1"; this.d=LS.get(this.K,null);
    if(!this.d){ this.d={users:{}, admins:[], session:null, questions:[], exams:[], attempts:{}, details:{}};
      (window.SAMPLE_QB||[]).forEach(q=>this.d.questions.push({id:uid(),...q,createdAt:Date.now()})); this._save(); } }
  _save(){ if(!LS.set(this.K,this.d)) toast("พื้นที่เก็บข้อมูลในเครื่องเต็ม","bad"); }
  _err(code){ const e=new Error(AUTH_MSG[code]||code); e.code=code; return e; }
  onAuth(cb){ this._cb=cb; setTimeout(()=>this._emit(),0); }
  _emit(){ const s=this.d.session; const u=s && Object.values(this.d.users).find(x=>x.uid===s); this._cb && this._cb(u? {uid:u.uid, username:u.username, displayName:u.displayName, avatar:u.avatar||0, admin:this.d.admins.includes(u.uid)} : null); }
  async admins(){ return this.d.admins; }
  async signUp(username,password,displayName){
    const k=username.toLowerCase(); if(this.d.users[k]) throw this._err("auth/email-already-in-use");
    if(password.length<6) throw this._err("auth/weak-password");
    const id="u"+uid(); this.d.users[k]={uid:id, username, displayName:displayName||username, avatar:0, pw:await sha(password), createdAt:Date.now()};
    if(!this.d.admins.length) this.d.admins.push(id);
    this.d.session=id; this._save(); this._emit();
  }
  async signIn(username,password){ const u=this.d.users[username.toLowerCase()]; if(!u || u.pw!==await sha(password)) throw this._err("auth/invalid-credential"); this.d.session=u.uid; this._save(); this._emit(); }
  async signOut(){ this.d.session=null; this._save(); this._emit(); }
  _byId(id){ return Object.values(this.d.users).find(x=>x.uid===id); }
  async changePassword(o,n){ const u=this._byId(this.d.session); if(u.pw!==await sha(o)) throw this._err("auth/invalid-credential"); if(n.length<6) throw this._err("auth/weak-password"); u.pw=await sha(n); this._save(); }
  async updateProfile(id,data){ Object.assign(this._byId(id),data); this._save(); }
  async listQuestions(){ return JSON.parse(JSON.stringify(this.d.questions)); }
  async addQuestions(list,by,onProg){ list.forEach(q=>this.d.questions.push({id:uid(),...q,createdAt:Date.now(),createdBy:by})); this._save(); onProg&&onProg(list.length,list.length); }
  async updateQuestion(id,data){ const q=this.d.questions.find(x=>x.id===id); Object.assign(q,data); this._save(); }
  async deleteQuestions(ids,onProg){ const s=new Set(ids); this.d.questions=this.d.questions.filter(q=>!s.has(q.id)); this._save(); onProg&&onProg(ids.length,ids.length); }
  async listExams(){ return [...this.d.exams].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); }
  async saveExam(e){ if(e.id){ const i=this.d.exams.findIndex(x=>x.id===e.id); this.d.exams[i]=e; } else this.d.exams.push({...e,id:uid()}); this._save(); }
  async deleteExam(id){ this.d.exams=this.d.exams.filter(e=>e.id!==id); this._save(); }
  async saveAttempt(id,sum,detail){ (this.d.attempts[id] ||= []).push(sum); this.d.details[sum.id]=detail; this._save(); }
  async listAttempts(id){ return [...(this.d.attempts[id]||[])].sort((a,b)=>b.createdAt-a.createdAt); }
  async getDetail(id,aid){ return this.d.details[aid]||null; }
  async deleteAttempt(id,aid){ this.d.attempts[id]=(this.d.attempts[id]||[]).filter(a=>a.id!==aid); delete this.d.details[aid]; this._save(); }
  async listUsers(){ return Object.values(this.d.users).map(({pw,...u})=>u); }
  async setAdmin(id,on){ this.d.admins = on? [...new Set([...this.d.admins,id])] : this.d.admins.filter(x=>x!==id); this._save(); }
}

/* ===================== analytics & charts ===================== */
function computeStats(atts){
  const asc=[...atts].sort((a,b)=>a.createdAt-b.createdAt);
  const recent=asc.slice(-10);
  const dom={}; DIDS.forEach(d=>dom[d]={c:0,t:0,ms:0});
  recent.forEach(a=>(a.items||[]).forEach(it=>{ const x=dom[it.d]; if(!x) return; x.t++; if(it.ok) x.c++; x.ms+=it.ms||0; }));
  const all={}; DIDS.forEach(d=>all[d]={c:0,t:0});
  const topic={}; const last={}; let totalQ=0, totalMs=0;
  asc.forEach(a=>(a.items||[]).forEach(it=>{
    totalQ++; totalMs+=it.ms||0;
    if(all[it.d]){ all[it.d].t++; if(it.ok) all[it.d].c++; }
    const k=it.tp||"ไม่ระบุหัวข้อ"; (topic[k] ||= {c:0,t:0,d:it.d}); topic[k].t++; if(it.ok) topic[k].c++;
    last[it.id]=!!it.ok;
  }));
  const wrongIds=Object.keys(last).filter(k=>!last[k]);
  const pcts=asc.map(a=>a.pct);
  const avg=pcts.length? pcts.reduce((s,x)=>s+x,0)/pcts.length : 0;
  const best=pcts.length? Math.max(...pcts) : 0;
  // คาดการณ์คะแนนสอบจริงตามน้ำหนักผัง
  let wsum=0, proj=0; DIDS.forEach(d=>{ if(dom[d].t){ wsum+=DOM[d].w; proj+=DOM[d].w*dom[d].c/dom[d].t; } });
  const projection = wsum? proj/wsum*100 : null;
  // วันต่อเนื่อง
  const days=new Set(asc.map(a=>new Date(a.createdAt).toDateString()));
  let streak=0; const dt=new Date(); if(!days.has(dt.toDateString())) dt.setDate(dt.getDate()-1);
  while(days.has(dt.toDateString())){ streak++; dt.setDate(dt.getDate()-1); }
  const today=asc.filter(a=>new Date(a.createdAt).toDateString()===new Date().toDateString()).reduce((s,a)=>s+a.total,0);
  return {count:asc.length, asc, dom, all, topic, wrongIds, avg, best, projection, streak, today, totalQ, avgSec: totalQ? totalMs/totalQ/1000 : 0};
}

function adviceFor(st){
  const tips=[];
  if(!st.count){ tips.push({d:3,icon:"target",t:"เริ่มจากแบบทดสอบวัดระดับ ด้านละ 10 ข้อ (50 ข้อ) เพื่อดูจุดแข็งจุดอ่อนก่อนวางแผนอ่าน",act:{t:"เริ่มวัดระดับ",p:{preset:"diag"}}}); return tips; }
  const doms=DIDS.filter(d=>st.dom[d].t>=3).map(d=>({d,acc:st.dom[d].c/st.dom[d].t,t:st.dom[d].t}));
  if(doms.length){
    const gain=doms.map(x=>({...x,g:DOM[x.d].w*(1-x.acc)*100})).sort((a,b)=>b.g-a.g)[0];
    if(gain.acc<.9) tips.push({d:gain.d,icon:"bolt",t:`ด้าน ${gain.d} ${DOM[gain.d].s} ตอบถูก ${r0(gain.acc*100)}% และมีน้ำหนัก ${r0(DOM[gain.d].w*100)}% ของข้อสอบ ถ้าเก็บด้านนี้ได้ครบจะเพิ่มคะแนนได้อีกราว ${r0(gain.g)} คะแนน คุ้มที่สุดที่จะฝึกตอนนี้`,act:{t:`ฝึกด้าน ${gain.d} 20 ข้อ`,p:{preset:"domain",d:gain.d}}});
    const low=doms.filter(x=>x.acc<PASS/100).sort((a,b)=>a.acc-b.acc);
    low.filter(x=>x.d!==gain.d).slice(0,1).forEach(x=>tips.push({d:x.d,icon:"target",t:`ด้าน ${x.d} ยังต่ำกว่าเกณฑ์ (${r0(x.acc*100)}%) เกณฑ์ผ่านคิดรายวิชา ควรกลับไปอ่านสรุปด้านนี้ก่อน แล้วค่อยฝึกซ้ำ`,act:{t:`ฝึกด้าน ${x.d}`,p:{preset:"domain",d:x.d}}}));
  }
  const weakT=Object.entries(st.topic).filter(([,v])=>v.t>=2 && v.c/v.t<.6).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t).slice(0,3);
  if(weakT.length) tips.push({d:weakT[0][1].d,icon:"book",t:"หัวข้อที่พลาดบ่อย: "+weakT.map(([k,v])=>`${k} (${r0(v.c*100/v.t)}%)`).join(" · ")+" — ทบทวนหัวข้อเหล่านี้เป็นพิเศษ"});
  if(st.wrongIds.length) tips.push({d:1,icon:"redo",t:`มีข้อที่เคยตอบผิดและยังไม่ได้แก้ ${st.wrongIds.length} ข้อ การทำซ้ำข้อที่ผิดช่วยให้จำได้แม่นขึ้น`,act:{t:"ฝึกข้อที่เคยผิด",p:{preset:"wrong"}}});
  if(st.asc.length>=4){ const a=st.asc.slice(-2).reduce((s,x)=>s+x.pct,0)/2, b=st.asc.slice(-4,-2).reduce((s,x)=>s+x.pct,0)/2;
    if(a-b>=5) tips.push({d:3,icon:"trend",t:`พัฒนาการดีขึ้น! 2 ครั้งล่าสุดเฉลี่ย ${r0(a)}% เพิ่มจาก ${r0(b)}% รักษาจังหวะนี้ไว้`});
    else if(b-a>=5) tips.push({d:1,icon:"trend",t:`คะแนน 2 ครั้งล่าสุดลดลง (${r0(b)}% → ${r0(a)}%) ลองพักสั้น ๆ แล้วทำชุดสั้นที่ด้านถนัดเพื่อเรียกความมั่นใจ`}); }
  if(st.avgSec>90) tips.push({d:4,icon:"clock",t:`ใช้เวลาเฉลี่ย ${r0(st.avgSec)} วินาทีต่อข้อ ค่อนข้างนาน ลองฝึกแบบจับเวลา ~1.2 นาที/ข้อ และข้ามข้อยากไปก่อน`});
  if(st.projection!=null) tips.push({d:5,icon:"star",t:`คาดการณ์คะแนนสอบจริงจากผลล่าสุดตามน้ำหนักผัง ≈ ${r0(st.projection)}% ${st.projection>=PASS? "อยู่ในเกณฑ์ผ่าน รักษาระดับด้วยการจำลองสอบเต็ม 100 ข้อ":"ยังต่ำกว่าเกณฑ์ 60% โฟกัสด้านที่แนะนำด้านบนก่อน"}`, act: st.projection>=PASS? {t:"จำลองสอบจริง",p:{preset:"real"}} : null});
  return tips;
}

/* line chart of scores */
function trendSVG(asc){
  const pts=asc.slice(-15); const W=600,H=220,pl=38,pr=16,pt=16,pb=30;
  const x=i=> pl + (pts.length<2? (W-pl-pr)/2 : i*(W-pl-pr)/(pts.length-1));
  const y=v=> pt + (100-v)*(H-pt-pb)/100;
  const grid=[0,20,40,60,80,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--soft)" stroke-width="2"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`).join("");
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.pct)}`).join("");
  const area= pts.length>1? `${line}L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z` : "";
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.pct)}" r="${i===pts.length-1?7:4.5}" fill="${p.pct>=PASS?"var(--ok)":"var(--bad)"}" stroke="var(--line)" stroke-width="2.5"/>`).join("");
  const lp=pts[pts.length-1];
  const lx=Math.min(x(pts.length-1), W-pr-30);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟคะแนนย้อนหลัง">
    ${grid}
    <line x1="${pl}" x2="${W-pr}" y1="${y(PASS)}" y2="${y(PASS)}" stroke="var(--ok)" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="${W-pr}" y="${y(PASS)-6}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ok)">เกณฑ์ผ่าน 60%</text>
    ${area? `<path d="${area}" fill="var(--pri)" opacity=".14"/>`:""}
    <path d="${line}" fill="none" stroke="var(--pri)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${lx}" y="${Math.max(14,y(lp.pct)-14)}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${r0(lp.pct)}%</text>
    <text x="${pl}" y="${H-8}" font-size="12" fill="var(--muted)">${pts.length} ครั้งล่าสุด</text>
  </svg>`;
}

/* radar of 5 domains */
function radarSVG(dom){
  const S=300,c=150,R=100; const ang=i=>-Math.PI/2+i*2*Math.PI/5;
  const P=(i,r)=>[c+r*Math.cos(ang(i)), c+r*Math.sin(ang(i))];
  const ring=f=>DIDS.map((d,i)=>P(i,R*f).join(",")).join(" ");
  const acc=DIDS.map(d=>dom[d].t? dom[d].c/dom[d].t : 0);
  const poly=acc.map((a,i)=>P(i,R*Math.max(a,.02)).join(",")).join(" ");
  const labels=DIDS.map((d,i)=>{ const [lx,ly]=P(i,R+30); const anc= Math.abs(lx-c)<10? "middle" : lx>c? "start":"end"; return `<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="13" font-weight="700" fill="var(--d${d})">ด้าน ${d}</text><text x="${lx}" y="${ly+16}" text-anchor="${anc}" font-size="13" fill="var(--ink)">${dom[d].t? r0(acc[i]*100)+"%" : "–"}</text>`; }).join("");
  return `<svg class="chart" viewBox="-40 -10 ${S+80} ${S+20}" role="img" aria-label="แผนภาพความแม่นยำ 5 ด้าน" style="max-width:380px;margin:0 auto">
    ${[.2,.4,.8,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--soft)" stroke-width="2"/>`).join("")}
    <polygon points="${ring(.6)}" fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 5"/>
    ${DIDS.map((d,i)=>`<line x1="${c}" y1="${c}" x2="${P(i,R)[0]}" y2="${P(i,R)[1]}" stroke="var(--soft)" stroke-width="2"/>`).join("")}
    <polygon points="${poly}" fill="var(--pri)" fill-opacity=".25" stroke="var(--pri)" stroke-width="3.5" stroke-linejoin="round"/>
    ${acc.map((a,i)=>{ const [px,py]=P(i,R*Math.max(a,.02)); return `<circle cx="${px}" cy="${py}" r="6" fill="var(--d${i+1})" stroke="var(--line)" stroke-width="2.5"/>`; }).join("")}
    ${labels}
  </svg>`;
}

function domBars(dom){
  return `<div class="list">${DIDS.map(d=>{ const x=dom[d]; const p=x.t? x.c*100/x.t : 0;
    return `<div class="dbar d${d}"><span class="nm" title="${esc(DOM[d].n)}">${d}. ${esc(DOM[d].s)}</span><div class="track"><i style="width:0" data-w="${p}"></i><span class="pass"></span></div><span class="pc">${x.t? r0(p)+"%" : "–"}</span></div>`; }).join("")}</div>`;
}

function startPreset(p){
  if(p.preset==="real") return go("practice",{mode:"real"});
  if(p.preset==="wrong") return go("practice",{mode:"wrong"});
  if(p.preset==="diag") return go("practice",{mode:"custom",counts:{1:10,2:10,3:10,4:10,5:10}});
  if(p.preset==="domain") return go("practice",{mode:"custom",counts:{[p.d]:20}});
  return go("practice",{mode:"custom"});
}

function buildExam(cfg,bank,st){
  let pool=bank;
  if(cfg.mode==="custom" && cfg.diffs.length) pool=bank.filter(q=>cfg.diffs.includes(q.difficulty));
  let picked=[], title="";
  const byD=(d,n)=>shuffle(pool.filter(q=>q.domain===d)).slice(0,n);
  if(cfg.mode==="real"){ DIDS.forEach(d=>picked.push(...byD(d,REAL[d]))); title="จำลองสอบจริง"; }
  else if(cfg.mode==="wrong"){ const s=new Set(st.wrongIds); picked=shuffle(bank.filter(q=>s.has(q.id))).slice(0,cfg.wrongN); title="ฝึกข้อที่เคยผิด"; }
  else if(cfg.mode==="preset"){ const e=cfg.exam; title=e.title; if(e.ids){ const m=new Map(bank.map(q=>[q.id,q])); picked=e.ids.map(id=>m.get(id)).filter(Boolean); } else DIDS.forEach(d=>picked.push(...byD(d,e.counts?.[d]||0))); }
  else { DIDS.forEach(d=>picked.push(...byD(d,cfg.counts[d]))); const ds=DIDS.filter(d=>cfg.counts[d]>0); title= ds.length===1? `ฝึกด้าน ${ds[0]} ${DOM[ds[0]].s}` : "ฝึกแบบกำหนดเอง"; }
  if(cfg.mode!=="preset" || !cfg.exam?.ids) picked=shuffle(picked);
  const qs=picked.map(q=>{
    let order=q.choices.map((_,i)=>i).filter(i=>String(q.choices[i]??"").trim()!=="");
    if(cfg.shuffleCh) order=shuffle(order);
    return {id:q.id,d:q.domain,tp:q.topic||"",q:q.question,ch:order.map(i=>q.choices[i]),a:order.indexOf(q.answer),exp:q.explanation||"",df:q.difficulty||""};
  });
  return {id:uid(),title,mode:cfg.mode,style:cfg.style,timeLimitMin:cfg.timed? cfg.minutes : 0,startedAt:Date.now(),endAt:cfg.timed? Date.now()+cfg.minutes*60000 : null,qs,ans:qs.map(()=>-1),fl:qs.map(()=>false),ms:qs.map(()=>0),cur:0,examRef:cfg.exam?.id||null};
}

function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }
async function leaveExamPrompt(){
  const k=await modal({title:"ออกจากการทำข้อสอบ?",body:"<p>บันทึกไว้ทำต่อภายหลังได้ (เวลายังเดินต่อถ้าจับเวลา)</p>",actions:[{k:null,t:"ทำต่อ",c:"ghost"},{k:"save",t:"บันทึกไว้ทำต่อ",c:""},{k:"submit",t:"ส่งคำตอบเลย",c:"pri"}]});
  if(k==="save"){ tickMs(); LS.set(draftKey(),S.exam); S.exam=null; return true; }
  if(k==="submit"){ await finishExam(); return false; }
  return false;
}
function tickMs(){ const e=S.exam; if(!e) return; const now=Date.now(); if(e._t) e.ms[e.cur]+=now-e._t; e._t=now; }

VIEWS.exam=async(v)=>{
  const e=S.exam; if(!e){ const d=LS.get(draftKey(),null); if(!d) return go("home"); S.exam=d; return VIEWS.exam(v); }
  e._t=Date.now();
  const practice=e.style==="practice";
  v.innerHTML=`
    <div class="exam-top"><button class="iconbtn" id="xq" aria-label="ออก">${ic("x")}</button><div class="t">${esc(e.title)}</div>${e.endAt? `<div class="timer" id="tm">${ic("clock")}<span>--:--</span></div>` : `<div class="timer">${ic("clock")}<span id="el">0:00</span></div>`}</div>
    <div class="prog"><i id="pg" style="width:0"></i></div>
    <div class="qwrap"><div class="card qcard" id="qc"></div></div>
    <div class="exam-foot"><button class="iconbtn" id="pv" aria-label="ข้อก่อนหน้า">${ic("left")}</button>
      <div class="row" style="justify-content:center;gap:8px"><button class="btn sm" id="gridb">${ic("grid")} <span id="cnt"></span></button><button class="iconbtn flag" id="fl" aria-label="ปักธง">${ic("flag")}</button></div>
      <button class="iconbtn" id="nx" aria-label="ข้อถัดไป" style="background:var(--pri);color:#fff">${ic("right")}</button></div>
    <button class="btn ok block" id="sub">${ic("check")} ส่งคำตอบ</button>`;
  const qc=$("#qc",v);
  const save=()=>LS.set(draftKey(),e);
  function paint(dir){
    const i=e.cur, q=e.qs[i], a=e.ans[i], locked=practice && a>=0;
    const html=`<div class="row" style="justify-content:space-between"><span class="qno">ข้อ ${i+1} / ${e.qs.length}</span><span class="dtag d${q.d}"><b>${q.d}</b>${esc(q.tp||DOM[q.d].s)}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="choices">${q.ch.map((c,j)=>{ let cls= a===j?"sel":""; if(locked){ if(j===q.a) cls="right"; else if(j===a) cls="wrong"; }
        return `<button class="choice ${cls}" data-c="${j}" ${locked?"disabled":""}><span class="L">${L[j]}</span><span>${esc(c)}</span></button>`; }).join("")}</div>
      ${locked? `<div class="explain pop"><b>${a===q.a?"ถูกต้อง! ":"ยังไม่ถูก "}</b>คำตอบคือ ${L[q.a]}. ${esc(q.ch[q.a])}${q.exp? `<br>${esc(q.exp)}`:""}</div>`:""}`;
    if(dir){ qc.classList.add(dir>0?"out-l":"out-r"); setTimeout(()=>{ qc.innerHTML=html; qc.classList.remove("out-l","out-r"); qc.classList.add(dir>0?"in-l":"in-r"); bind(); requestAnimationFrame(()=>requestAnimationFrame(()=>qc.classList.remove("in-l","in-r"))); },200); }
    else { qc.innerHTML=html; bind(); }
    const done=e.ans.filter(x=>x>=0).length;
    $("#pg",v).style.width=(done*100/e.qs.length)+"%"; $("#cnt",v).textContent=`${done}/${e.qs.length}`;
    $("#fl",v).classList.toggle("on",!!e.fl[i]);
    $("#pv",v).disabled=i===0; $("#pv",v).style.opacity=i===0?.4:1;
    $("#nx",v).style.opacity= i===e.qs.length-1? .4:1;
  }
  function bind(){
    $$(".choice",qc).forEach(b=>b.onclick=()=>{
      const i=e.cur, j=+b.dataset.c; if(practice && e.ans[i]>=0) return;
      e.ans[i]= (!practice && e.ans[i]===j)? -1 : j; save();
      if(practice){ paint(); const ok=j===e.qs[i].a; const el=$(`.choice[data-c="${j}"]`,qc); el?.classList.add(ok?"bump":"shake"); }
      else { $$(".choice",qc).forEach(x=>x.classList.toggle("sel",+x.dataset.c===e.ans[i])); b.classList.add("bump"); setTimeout(()=>b.classList.remove("bump"),450);
        const done=e.ans.filter(x=>x>=0).length; $("#pg",v).style.width=(done*100/e.qs.length)+"%"; $("#cnt",v).textContent=`${done}/${e.qs.length}`;
        if(e.ans[i]>=0 && i<e.qs.length-1) setTimeout(()=>{ if(e.cur===i) move(1); },380); }
    });
  }
  function move(d){ const n=e.cur+d; if(n<0||n>=e.qs.length) return; tickMs(); e.cur=n; save(); paint(d); }
  $("#pv",v).onclick=()=>move(-1); $("#nx",v).onclick=()=>move(1);
  $("#fl",v).onclick=()=>{ e.fl[e.cur]=!e.fl[e.cur]; save(); $("#fl",v).classList.toggle("on",e.fl[e.cur]); };
  $("#xq",v).onclick=()=>go("home");
  $("#sub",v).onclick=async()=>{ const un=e.ans.filter(x=>x<0).length, fl=e.fl.filter(Boolean).length;
    if(await confirmBox("ส่งคำตอบ?", un||fl? `ยังไม่ได้ตอบ ${un} ข้อ${fl?` · ปักธงไว้ ${fl} ข้อ`:""} ต้องการส่งเลยหรือไม่` : "ตอบครบทุกข้อแล้ว พร้อมส่ง", "ส่งคำตอบ", "ok")) finishExam(); };
  $("#gridb",v).onclick=()=>modal({title:"ไปยังข้อ",body:`<div class="navgrid">${e.qs.map((q,i)=>{ let c=e.ans[i]>=0?"ans":""; if(practice&&e.ans[i]>=0) c=e.ans[i]===q.a?"r":"w"; return `<button data-j="${i}" class="${c} ${e.fl[i]?"fl":""} ${i===e.cur?"cur":""}">${i+1}</button>`; }).join("")}</div><p class="small muted" style="margin-top:10px">สีม่วง = ตอบแล้ว · จุดส้ม = ปักธง</p>`,actions:[{k:null,t:"ปิด",c:""}],onOpen:(sc,close)=>$$("[data-j]",sc).forEach(b=>b.onclick=()=>{ const j=+b.dataset.j; close(null); if(j!==e.cur){ tickMs(); const d=j>e.cur?1:-1; e.cur=j; save(); paint(d); } })});
  // swipe
  let sx=null, sy=null; qc.addEventListener("touchstart",ev=>{ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; },{passive:true});
  qc.addEventListener("touchend",ev=>{ if(sx==null) return; const dx=ev.changedTouches[0].clientX-sx, dy=ev.changedTouches[0].clientY-sy; if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) move(dx<0?1:-1); sx=null; });
  v._key=ev=>{ if(S.view!=="exam"||$(".scrim")) return; if(ev.key==="ArrowRight") move(1); else if(ev.key==="ArrowLeft") move(-1); else { const k="1234".indexOf(ev.key); const t="กขคง".indexOf(ev.key); const j=k>=0?k:t; if(j>=0){ const b=$(`.choice[data-c="${j}"]`,qc); b&&b.click(); } } };
  document.onkeydown=v._key;
  paint();
  stopTimer();
  const tm=$("#tm",v), el=$("#el",v);
  const tick=()=>{ if(S.view!=="exam"||S.exam!==e) return stopTimer();
    if(e.endAt){ const left=(e.endAt-Date.now())/1000; $("span",tm).textContent=fmtTime(left); tm.classList.toggle("low",left<=300); if(left<=0){ stopTimer(); toast("หมดเวลา! ส่งคำตอบอัตโนมัติ","bad"); finishExam(); } }
    else el.textContent=fmtTime((Date.now()-e.startedAt)/1000); };
  tick(); S.timer=setInterval(tick,1000);
};

async function finishExam(){
  const e=S.exam; if(!e||e._finishing) return; e._finishing=true; stopTimer(); tickMs();
  const items=e.qs.map((q,i)=>({id:q.id,d:q.d,tp:q.tp,ch:e.ans[i],a:q.a,ok:e.ans[i]===q.a,fl:!!e.fl[i],ms:Math.round(e.ms[i])}));
  const byDomain={}; DIDS.forEach(d=>byDomain[d]={c:0,t:0}); items.forEach(it=>{ byDomain[it.d].t++; if(it.ok) byDomain[it.d].c++; });
  const correct=items.filter(x=>x.ok).length, total=items.length, p=pct(correct,total);
  const now=Date.now(); const dur=Math.round(Math.min(now, e.endAt||now)-e.startedAt)/1000;
  const sum={id:e.id,title:e.title,mode:e.mode,style:e.style,createdAt:now,startedAt:e.startedAt,durationSec:Math.round(dur),timeLimitMin:e.timeLimitMin,total,correct,answered:items.filter(x=>x.ch>=0).length,pct:p,passed:p>=PASS,byDomain,items,examRef:e.examRef||null};
  const detail={id:e.id,qs:e.qs.map(q=>({id:q.id,d:q.d,tp:q.tp,q:q.q,ch:q.ch,a:q.a,exp:q.exp}))};
  try{ await S.store.saveAttempt(S.user.uid,sum,detail); LS.del(draftKey()); S.atts=[sum,...(S.atts||[])]; }
  catch(x){ console.error(x); toast("บันทึกผลไม่สำเร็จ: "+errMsg(x)+" (ผลยังแสดงให้ดู)","bad"); const pend=LS.get("hkt_pending",[]); pend.push({uid:S.user.uid,sum,detail}); LS.set("hkt_pending",pend); LS.del(draftKey()); }
  S.exam=null; document.onkeydown=null;
  go("result",{sum,detail,fresh:true,force:true});
}
async function flushPending(){ const pend=LS.get("hkt_pending",[]); if(!pend.length) return; const left=[]; for(const p of pend){ if(p.uid!==S.user.uid){ left.push(p); continue; } try{ await S.store.saveAttempt(p.uid,p.sum,p.detail); }catch(e){ left.push(p); } } LS.set("hkt_pending",left); if(left.length<pend.length){ toast("บันทึกผลที่ค้างไว้เรียบร้อย","ok"); S.atts=null; } }

  if(!detail) detail=await S.store.getDetail(owner,sum.id);
  const qm=new Map((detail?.qs||[]).map(q=>[q.id,q]));
  const bm=new Map((S.bank||[]).map(q=>[q.id,q]));
  const passed=sum.pct>=PASS, C=2*Math.PI*70;
  const wrongTopics={}; sum.items.filter(x=>!x.ok).forEach(x=>{ const k=x.tp||DOM[x.d].s; wrongTopics[k]=(wrongTopics[k]||0)+1; });

  const weakD=DIDS.filter(d=>sum.byDomain[d]?.t).sort((a,b)=>sum.byDomain[a].c/sum.byDomain[a].t-sum.byDomain[b].c/sum.byDomain[b].t)[0];

    <div class="ring"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" fill="none" stroke="var(--soft)" stroke-width="16"/><circle id="rg" cx="80" cy="80" r="70" fill="none" stroke="${passed?"var(--ok)":"var(--bad)"}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="c"><b id="rp">0%</b><span class="muted small">${sum.correct}/${sum.total} ข้อ</span></div></div>
    <div class="row" style="justify-content:center"><span class="badge pri">${esc(sum.title)}</span><span class="badge">${fmtDate(sum.createdAt)}</span><span class="badge">ใช้เวลา ${fmtDur(sum.durationSec)}</span><span class="badge">เฉลี่ย ${r0(avgSec)} วิ/ข้อ</span>${sum.total-sum.answered? `<span class="badge warn">ไม่ได้ตอบ ${sum.total-sum.answered} ข้อ</span>`:""}</div>
  </div>
  <div class="card pop"><h3>${ic("list")} คะแนนรายด้าน</h3>${domBars(sum.byDomain)}</div>
  <div class="card pop"><h3>${ic("bolt")} วิเคราะห์ชุดนี้</h3><div class="advice">
    ${weakD&&sum.byDomain[weakD].c<sum.byDomain[weakD].t? `<div class="tipc d${weakD}"><span class="b">${ic("target",2.6)}</span><p>ด้านที่ควรเร่งพัฒนาในชุดนี้คือ <b>ด้าน ${weakD} ${esc(DOM[weakD].s)}</b> ตอบถูก ${sum.byDomain[weakD].c}/${sum.byDomain[weakD].t} ข้อ</p></div>`:""}
    ${wt.length? `<div class="tipc d1"><span class="b">${ic("book",2.6)}</span><p>หัวข้อที่พลาด: ${wt.map(([k,n])=>`${esc(k)} (${n})`).join(" · ")}</p></div>`:`<div class="tipc d3"><span class="b">${ic("star",2.6)}</span><p>ตอบถูกทุกข้อ ยอดเยี่ยม!</p></div>`}
    ${sum.timeLimitMin? `<div class="tipc d4"><span class="b">${ic("clock",2.6)}</span><p>ใช้เวลา ${fmtDur(sum.durationSec)} จาก ${sum.timeLimitMin} นาที ${sum.durationSec/60>sum.timeLimitMin*.95? "— เกือบหมดเวลา ลองข้ามข้อยากแล้วค่อยกลับมาทำ":"— บริหารเวลาได้ดี"}</p></div>`:""}

  <div class="row"><button class="btn pri" id="again">${ic("redo")} ทำชุดนี้อีกครั้ง</button>${sum.items.some(x=>!x.ok)? `<button class="btn pink" id="wrongOnly">${ic("target")} ฝึกเฉพาะข้อที่ผิด</button>`:""}<button class="btn" data-go="home">${ic("home")} หน้าหลัก</button></div></div>

    <div class="list" id="rl"></div></div>`;

  function list(f){

      ${q? `<p style="white-space:pre-wrap">${esc(q.q)}</p>${q.ch? `<div class="choices">${q.ch.map((c,j)=>`<div class="choice ${j===it.a?"right":j===it.ch?"wrong":""}"><span class="L">${L[j]}</span><span>${esc(c)}</span></div>`).join("")}</div>`:""}${q.exp? `<div class="explain"><b>เหตุผล </b>${esc(q.exp)}</div>`:""}` : `<p class="muted">ไม่พบรายละเอียดข้อสอบนี้</p>`}</div>`; }).join("") : `<p class="muted">ไม่มีรายการ</p>`;
  }
  list("all");
  $$("#rf .chip",v).forEach(b=>b.onclick=()=>{ $$("#rf .chip",v).forEach(x=>x.classList.toggle("on",x===b)); list(b.dataset.f); });
  const reuse=(filterFn,title)=>{ const qs=(detail?.qs||[]).filter((q,i)=>filterFn(sum.items[i])).map(q=>{ const order=shuffle(q.ch.map((_,i)=>i)); return {...q,ch:order.map(i=>q.ch[i]),a:order.indexOf(q.a)}; });
    if(!qs.length) return toast("ไม่พบข้อสอบของชุดนี้","bad");
    const ex={id:uid(),title,mode:"retry",style:sum.style||"exam",timeLimitMin:sum.timeLimitMin? Math.max(1,Math.round(sum.timeLimitMin*qs.length/sum.total)):0,startedAt:Date.now(),qs:shuffle(qs),cur:0};
    ex.endAt=ex.timeLimitMin? Date.now()+ex.timeLimitMin*60000 : null; ex.ans=ex.qs.map(()=>-1); ex.fl=ex.qs.map(()=>false); ex.ms=ex.qs.map(()=>0);
    S.exam=ex; LS.set(draftKey(),ex); go("exam"); };
  $("#again",v).onclick=()=>reuse(()=>true, sum.title+" (ซ้ำ)");
  const wo=$("#wrongOnly",v); if(wo) wo.onclick=()=>reuse(it=>!it.ok, "ข้อที่ผิดจาก "+sum.title);
  if(other){

    $("#backM",v).onclick=()=>go("member",{uid:owner});
    v.prepend(h(`<div class="card pop" style="background:var(--soft)"><div class="row" style="justify-content:space-between"><span>${ic("shield")} ผู้ดูแลกำลังดูผลของ <b>${esc(who||"สมาชิก")}</b></span><button class="btn sm" id="backM2">${ic("left")} กลับ</button></div></div>`));
    $("#backM2",v).onclick=()=>go("member",{uid:owner});
  }
};

const TOUR_STEPS=[
  {sel:null, t:"ยินดีต้อนรับสู่ฮูกติวครู!", d:"ฮูกจะพาดูทีละจุดสั้น ๆ ว่าแต่ละส่วนใช้ทำอะไร ใช้เวลาไม่ถึง 1 นาที กด “ถัดไป” ได้เลย"},

  {sel:"#tRadar", t:"ภาพความแม่นยำ 5 ด้าน", d:"ด้านไหนกราฟหุบเข้าในเส้นประสีเขียว แปลว่ายังต่ำกว่าเกณฑ์ ควรอ่านทบทวนด้านนั้นก่อน"},
  {sel:"#tAdv", t:"กลยุทธ์จากฮูก", d:"ฮูกวิเคราะห์ผลให้ว่าควรฝึกอะไรต่อจะได้คะแนนเพิ่มมากที่สุด กดปุ่มในกล่องเพื่อเริ่มฝึกได้ทันที"},
  {sel:"@nav", t:"เมนูหลัก", d:"หน้าหลัก · ฝึกสอบ · ประวัติ (ดูผลย้อนหลังและเฉลย) · ฉัน (โปรไฟล์ เปลี่ยนรหัสผ่าน ออกจากระบบ)"},
  {sel:null, t:"พร้อมแล้ว ลุยกันเลย!", d:"ทำวันละชุดสั้น ๆ สม่ำเสมอดีกว่าทำเยอะวันเดียว อยากดูแนะนำนี้อีกครั้ง ไปที่เมนู “ฉัน” ได้เลย"}
];
function maybeTour(v,params){
  const key="hkt_tour_"+(S.user?.uid||"x"), today=new Date().toDateString();
  if(!params.tour && LS.get(key,"")===today) return;
  LS.set(key,today);
  setTimeout(()=>{ if(S.view==="home") runTour(); }, params.tour? 350 : 900);
}
function runTour(){
  if($(".tour")) return;
  const steps=TOUR_STEPS.filter(s=>!s.sel || s.sel==="@nav" || $(s.sel));
  let i=0;
  const root=h(`<div class="tour" role="dialog" aria-modal="true" aria-label="แนะนำการใช้งาน"><svg class="tour-mask" aria-hidden="true"><path fill-rule="evenodd"></path></svg><div class="tour-hole"></div><div class="tour-tip"><div class="tour-owl">${owl("happy",OWL_COLORS[S.user?.avatar||0],"")}</div><div><b class="tt"></b><p class="td"></p><div class="tour-bar"><span class="tn"></span><span class="sp"></span><button class="btn ghost sm" data-k="skip">ข้าม</button><button class="btn ghost sm" data-k="back">ย้อน</button><button class="btn pri sm" data-k="next">ถัดไป</button></div></div></div></div>`);
  document.body.append(root);
  const hole=$(".tour-hole",root), tip=$(".tour-tip",root), mp=$(".tour-mask path",root);
  const mask=(x,y,w,hh)=>{ const W=innerWidth,H=innerHeight,r=Math.min(22,w/2,hh/2); let d=`M0 0H${W}V${H}H0Z`; if(w>0) d+=`M${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+hh-r}Q${x+w} ${y+hh} ${x+w-r} ${y+hh}H${x+r}Q${x} ${y+hh} ${x} ${y+hh-r}V${y+r}Q${x} ${y} ${x+r} ${y}Z`; mp.setAttribute("d",d); };
  const navEl=()=> getComputedStyle($(".bnav")).display!=="none" && !$(".bnav").classList.contains("hide") ? $(".bnav .inner") : $(".topnav");
  function place(){
    const s=steps[i]; const el= s.sel==="@nav"? navEl() : s.sel? $(s.sel) : null;
    $(".tt",root).textContent=s.t; $(".td",root).textContent=s.d; $(".tn",root).textContent=`${i+1}/${steps.length}`;
    $('[data-k="back"]',root).classList.toggle("hide",i===0);
    $('[data-k="next"]',root).textContent= i===steps.length-1? "เริ่มใช้งาน" : "ถัดไป";
    tip.classList.remove("show");
    if(!el){ mask(0,0,0,0); hole.classList.add("none"); tip.classList.add("center"); requestAnimationFrame(()=>tip.classList.add("show")); return; }
    hole.classList.remove("none"); tip.classList.remove("center");
    const fixed=getComputedStyle(el.closest(".bnav")||el).position==="fixed" || !!el.closest(".bnav") || !!el.closest(".top");
    if(!fixed) el.scrollIntoView({block:"center",behavior:"smooth"});
    setTimeout(()=>{
      const r=el.getBoundingClientRect(), pad=8;
      Object.assign(hole.style,{top:(r.top-pad)+"px",left:(r.left-pad)+"px",width:(r.width+pad*2)+"px",height:(r.height+pad*2)+"px"}); mask(r.left-pad,r.top-pad,r.width+pad*2,r.height+pad*2);
      const below=r.bottom+14, th=tip.offsetHeight||170, W=innerWidth;
      const top= (below+th < innerHeight-8) ? below : Math.max(8, r.top-th-14);
      tip.style.top=top+"px"; tip.style.left=Math.max(12,Math.min(W-tip.offsetWidth-12, r.left+r.width/2-tip.offsetWidth/2))+"px";
      tip.classList.add("show");
    }, fixed? 60 : 420);
  }
  function end(){ root.classList.add("off"); setTimeout(()=>root.remove(),320); removeEventListener("resize",place); document.removeEventListener("keydown",key); window.scrollTo({top:0,behavior:"smooth"}); }
  const key=e=>{ if(e.key==="Escape") end(); else if(e.key==="ArrowRight") nx(); else if(e.key==="ArrowLeft"&&i>0){ i--; place(); } };
  const nx=()=>{ if(i<steps.length-1){ i++; place(); } else end(); };
  root.addEventListener("click",e=>{ const k=e.target.closest("[data-k]")?.dataset.k; if(k==="next") nx(); else if(k==="back"){ i=Math.max(0,i-1); place(); } else if(k==="skip") end(); });
  addEventListener("resize",place); document.addEventListener("keydown",key);
  requestAnimationFrame(()=>{ root.classList.add("on"); place(); });
}

const HEAD=["ที่","ด้าน","หัวข้อ","คำถาม","ตัวเลือก ก","ตัวเลือก ข","ตัวเลือก ค","ตัวเลือก ง","เฉลย","เหตุผล/คำอธิบาย","ความยาก","ระดับพฤติกรรม"];
function needXLSX(){ if(!window.XLSX){ toast("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต","bad"); return false; } return true; }
function downloadTemplate(){

  ws["!cols"]=[5,6,22,60,30,30,30,30,7,60,9,16].map(w=>({wch:w}));
  const n=XLSX.utils.aoa_to_sheet([["คำชี้แจง"],["ด้าน = 1–5 · เฉลย = ก/ข/ค/ง (หรือ 1–4, A–D) · ต้องมีคำถาม ตัวเลือกอย่างน้อย 2 ตัว และเฉลย"],[],["ด้าน","ชื่อมาตรฐานความรู้"],...DIDS.map(d=>[d,DOM[d].n])]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"ข้อสอบ"); XLSX.utils.book_append_sheet(wb,n,"คำชี้แจง");
  XLSX.writeFile(wb,"แม่แบบนำเข้าข้อสอบ.xlsx");

function exportBank(bank){
  if(!needXLSX()) return;
  const rows=[HEAD,...[...bank].sort((a,b)=>a.domain-b.domain).map((q,i)=>[i+1,q.domain,q.topic||"",q.question,...[0,1,2,3].map(j=>q.choices?.[j]||""),L[q.answer],q.explanation||"",q.difficulty||"",q.level||""])];
  const ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=[5,6,22,60,30,30,30,30,7,60,9,16].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"ข้อสอบ"); XLSX.writeFile(wb,`คลังข้อสอบ_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function parseAnswer(v,choices){
  const s=String(v??"").trim(); if(!s) return -1;
  const m={"ก":0,"ข":1,"ค":2,"ง":3,"จ":4,"a":0,"b":1,"c":2,"d":3,"e":4,"1":0,"2":1,"3":2,"4":3,"5":4};
  const k=s.replace(/^ตัวเลือก\s*/,"").replace(/[.)\s]/g,"").toLowerCase(); if(k in m) return m[k];
  const i=choices.findIndex(c=>c && c.trim()===s); return i;
}
function parseSheetRows(aoa, fname){
  const hi=aoa.findIndex(r=>r && r.some(c=>/คำถาม|question/i.test(String(c||""))));
  if(hi<0) return {rows:[],errs:[`${fname}: ไม่พบหัวคอลัมน์ “คำถาม”`]};
  const H=aoa[hi].map(c=>String(c||"").trim());
  const col=(re)=>H.findIndex(x=>re.test(x));
  const cD=col(/^ด้าน|domain|สาระ|มาตรฐาน/i), cT=col(/หัวข้อ|topic/i), cQ=col(/คำถาม|question/i), cA=col(/เฉลย|คำตอบ|answer/i), cE=col(/เหตุผล|อธิบาย|explan/i), cF=col(/ยาก|difficult/i), cV=col(/ระดับพฤติกรรม|พฤติกรรม|bloom|level/i);
  const cC=["ก","ข","ค","ง","จ"].map((t,j)=>col(new RegExp(`^(ตัวเลือก\\s*)?(${t}|${"ABCDE"[j]}|${j+1})$|ตัวเลือก\\s*${t}|choice\\s*${"ABCDE"[j]}`,"i"))).filter(i=>i>=0);
  const rows=[], errs=[];
  aoa.slice(hi+1).forEach((r,k)=>{ if(!r) return; const line=hi+k+2; const q=String(r[cQ]??"").trim(); if(!q) return;
    const choices=cC.map(i=>String(r[i]??"").trim()); while(choices.length>2 && !choices[choices.length-1]) choices.pop();
    let d=parseInt(String(r[cD]??"").replace(/[^\d]/g,"")); const a=parseAnswer(r[cA],choices);
    let diff=String(r[cF]??"").trim(); if(diff==="กลาง") diff="ปานกลาง";
    const item={domain:d,topic:String(r[cT]??"").trim(),question:q,choices,answer:a,explanation:String(r[cE]??"").trim(),difficulty:DIFFS.includes(diff)?diff:"",level:String(r[cV]??"").trim()};
    const e=[]; if(!(d>=1&&d<=5)) e.push("ด้านต้องเป็น 1–5"); if(choices.filter(Boolean).length<2) e.push("ตัวเลือกไม่ครบ"); if(a<0||!choices[a]) e.push("เฉลยไม่ถูกต้อง");
    rows.push({item,err:e.join(", "),line,file:fname}); });
  return {rows,errs};
}
async function importFlow(files,bank){
  if(!needXLSX()) return;
  let rows=[], errs=[];
  for(const f of files){ try{ const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); const sn=wb.SheetNames.find(n=>/ข้อสอบ/.test(n))||wb.SheetNames[0]; const r=parseSheetRows(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""}),f.name); rows.push(...r.rows); errs.push(...r.errs); }catch(e){ errs.push(`${f.name}: อ่านไฟล์ไม่ได้`); } }
  const have=new Set(bank.map(q=>q.question.trim()));
  rows.forEach(r=>r.dup=have.has(r.item.question));
  const good=rows.filter(r=>!r.err), bad=rows.filter(r=>r.err), dup=good.filter(r=>r.dup);
  const body=h(`<div class="list">
    <div class="row"><span class="badge ok">พร้อมนำเข้า ${good.length}</span><span class="badge bad">มีปัญหา ${bad.length}</span><span class="badge warn">ซ้ำกับคลัง ${dup.length}</span></div>
    ${errs.map(e=>`<p class="err">${esc(e)}</p>`).join("")}
    <div class="row">${DIDS.map(d=>`<span class="dtag d${d}"><b>${d}</b>${good.filter(r=>r.item.domain===d).length} ข้อ</span>`).join("")}</div>
    ${rows.length? `<div class="tbl" style="max-height:300px"><table><tr><th>แถว</th><th>ด้าน</th><th>คำถาม</th><th>เฉลย</th><th>สถานะ</th></tr>${rows.slice(0,200).map(r=>`<tr class="${r.err?"bad":""}"><td>${r.line}</td><td>${r.item.domain||"?"}</td><td>${esc(r.item.question.slice(0,70))}${r.item.question.length>70?"…":""}</td><td>${r.item.answer>=0?L[r.item.answer]:"?"}</td><td>${r.err? esc(r.err) : r.dup? "ซ้ำ":"✓"}</td></tr>`).join("")}</table></div>`:""}
    ${dup.length? `<label class="switch">ข้ามข้อที่ซ้ำกับคลัง<input type="checkbox" id="skipDup" checked></label>`:""}
    <div class="prog hide" id="ip"><i style="width:0"></i></div></div>`);
  await modal({title:`${ic("upload")} ตรวจสอบก่อนนำเข้า`,body,actions:[{k:null,t:"ยกเลิก",c:"ghost"},{k:"ok",t:"นำเข้า",c:"pri",run:async sc=>{
    const skip=$("#skipDup",sc)?.checked ?? true; const list=good.filter(r=>!(skip&&r.dup)).map(r=>r.item);
    if(!list.length){ toast("ไม่มีข้อที่จะนำเข้า","bad"); return false; }
    $("#ip",sc).classList.remove("hide");
    try{ await S.store.addQuestions(list,S.user.uid,(n,t)=>{ $("#ip i",sc).style.width=(n*100/t)+"%"; }); toast(`นำเข้า ${list.length} ข้อเรียบร้อย`,"ok"); go("manage",{tab:"bank"}); }
    catch(e){ toast(errMsg(e),"bad"); return false; } }}]});
}
