    <div class="list">${DIDS.map(d=>`<div class="dbar d${d}" style="grid-template-columns:1fr auto"><span class="dtag"><b>${d}</b>${esc(DOM[d].s)} <span class="muted">(${bank.filter(q=>q.domain===d).length})</span></span><div class="stepper"><input data-c="${d}" inputmode="numeric" value="${REAL[d]}"></div></div>`).join("")}</div>
    <div class="row"><span>เวลา</span><div class="stepper"><input id="em" inputmode="numeric" value="120"></div><span class="muted">นาที (0 = ไม่จับเวลา)</span></div>
    <div class="seg" id="es"><button class="on" data-s="exam">เฉลยตอนจบ</button><button data-s="practice">เฉลยทันที</button></div>
    <label class="switch">ตรึงข้อสอบ (ทุกคนได้ชุดเดียวกัน เทียบคะแนนกันได้)<input type="checkbox" id="ef" checked></label>
    <button class="btn pri" id="esv">บันทึกชุดข้อสอบ</button></div>`;
  let style="exam"; $$("#es button",root).forEach(b=>b.onclick=()=>{ style=b.dataset.s; $$("#es button",root).forEach(x=>x.classList.toggle("on",x===b)); });
  $$("[data-x]",root).forEach(b=>b.onclick=async()=>{ if(await confirmBox("ลบชุดข้อสอบนี้?","ประวัติที่ทำไปแล้วยังอยู่","ลบ")){ await S.store.deleteExam(b.dataset.x); S.exams=null; go("manage",{tab:"exams"}); } });
  $("#esv",root).onclick=async()=>{
    const title=$("#et",root).value.trim(); if(!title) return toast("กรุณาตั้งชื่อชุด","bad");
    const counts={}; DIDS.forEach(d=>counts[d]=Math.max(0,parseInt($(`[data-c="${d}"]`,root).value)||0));
    let total=DIDS.reduce((s,d)=>s+Math.min(counts[d],bank.filter(q=>q.domain===d).length),0); if(!total) return toast("จำนวนข้อเป็น 0","bad");
    const e={title,desc:$("#ed",root).value.trim(),counts,timeLimitMin:Math.max(0,parseInt($("#em",root).value)||0),style,createdAt:Date.now(),createdBy:S.user.uid,total};
    if($("#ef",root).checked){ const ids=[]; DIDS.forEach(d=>ids.push(...shuffle(bank.filter(q=>q.domain===d)).slice(0,counts[d]).map(q=>q.id))); e.ids=shuffle(ids); e.total=ids.length; }
    try{ await S.store.saveExam(e); S.exams=null; toast("บันทึกชุดข้อสอบแล้ว","ok"); go("manage",{tab:"exams"}); }catch(x){ toast(errMsg(x),"bad"); }
  };
}

/* ---------- members ---------- */
async function mMembers(root){
  const [users,admins]=await Promise.all([S.store.listUsers(),S.store.admins()]);
  const data=await Promise.all(users.map(async u=>{ try{ const a=await S.store.listAttempts(u.uid); return {u,st:computeStats(a),last:a[0]?.createdAt}; }catch(e){ return {u,st:null}; } }));
  root.innerHTML=`<div class="card pop"><h3>${ic("users")} สมาชิกครอบครัว <small>${users.length} คน</small></h3><div class="list">${data.map(({u,st,last})=>`
    <div class="li" style="grid-template-columns:auto 1fr auto auto">${owl("happy",OWL_COLORS[u.avatar||0],"").replace("<svg",'<svg style="width:48px;height:48px"')}
      <span><b>${esc(u.displayName)}</b> <span class="small muted">@${esc(u.username)}</span> ${admins.includes(u.uid)?'<span class="badge pri">ผู้ดูแล</span>':""}<br>
      <span class="small muted">${st&&st.count? `ทำ ${st.count} ครั้ง · เฉลี่ย ${r0(st.avg)}% · ดีสุด ${r0(st.best)}% · คาดการณ์ ${st.projection==null?"–":r0(st.projection)+"%"}${last?` · ล่าสุด ${fmtDate(last)}`:""}` : "ยังไม่เคยทำข้อสอบ"}</span></span>
      <button class="btn sm pri" data-mv="${u.uid}">${ic("list")} ดูประวัติละเอียด</button>
      ${u.uid!==S.user.uid? `<button class="btn sm" data-ad="${u.uid}" data-on="${admins.includes(u.uid)?0:1}">${admins.includes(u.uid)?"ถอดผู้ดูแล":"ตั้งเป็นผู้ดูแล"}</button>`:`<span class="badge">คุณ</span>`}</div>`).join("")}</div></div>
    <p class="small muted" style="text-align:center">ให้สมาชิกสมัครเองจากหน้าเข้าสู่ระบบ แล้วจะปรากฏที่นี่</p>`;
  $$("[data-mv]",root).forEach(b=>b.onclick=()=>go("member",{uid:b.dataset.mv}));
  $$("[data-ad]",root).forEach(b=>b.onclick=async()=>{ try{ await S.store.setAdmin(b.dataset.ad,b.dataset.on==="1"); toast("อัปเดตสิทธิ์แล้ว","ok"); go("manage",{tab:"members"}); }catch(e){ toast(errMsg(e),"bad"); } });
}

/* ---------- member detail (admin) ---------- */
const MODE_TH={real:"จำลองสอบจริง",custom:"สุ่มฝึก",wrong:"ฝึกข้อที่ผิด",retry:"ทำซ้ำ",exam:"ชุดข้อสอบ"};
VIEWS.member=async(v,{uid:id})=>{
  if(!S.user.admin){ v.innerHTML=`<div class="card empty">${owl("think")}<p>หน้านี้สำหรับผู้ดูแลระบบ</p></div>`; return; }
  const [users,atts]=await Promise.all([S.store.listUsers(),S.store.listAttempts(id)]);
  const u=users.find(x=>x.uid===id)||{uid:id,displayName:"สมาชิก",username:"-"};
  const st=computeStats(atts); const passN=atts.filter(a=>a.pct>=PASS).length;
  const totalMin=atts.reduce((s,a)=>s+(a.durationSec||0),0)/60;
  const topics=Object.entries(st.topic).map(([k,x])=>({k,...x,p:x.c*100/x.t})).sort((a,b)=>a.p-b.p||b.t-a.t);
  // กิจกรรม 14 วันล่าสุด
  const days=[...Array(14)].map((_,i)=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-13+i); return d; });
  const act=days.map(d=>{ const n=atts.filter(a=>new Date(a.createdAt).toDateString()===d.toDateString()); return {d,n:n.length,q:n.reduce((s,a)=>s+a.total,0)}; });
  const mx=Math.max(1,...act.map(x=>x.q));
  const modeOf=a=>MODE_TH[a.mode]||a.mode||"-";
  v.innerHTML=`
  <div class="card hero pop">${owl("happy",OWL_COLORS[u.avatar||0])}
    <div><h2>${esc(u.displayName)}</h2><p class="muted">@${esc(u.username)} · ${st.count? `ทำล่าสุด ${fmtDate(atts[0].createdAt)}`:"ยังไม่เคยทำข้อสอบ"}</p>
    <div class="row"><button class="btn sm" id="bk">${ic("left")} กลับรายชื่อสมาชิก</button>${st.count? `<button class="btn sm" id="csv">${ic("dl")} ส่งออก CSV</button>`:""}</div></div></div>
  <div class="kpis pop">
    <div class="kpi"><div class="v">${st.count}</div><div class="l">ครั้งที่ทำ</div></div>
    <div class="kpi"><div class="v">${st.count? r0(st.avg)+"%":"–"}</div><div class="l">คะแนนเฉลี่ย</div></div>
    <div class="kpi"><div class="v">${st.count? r0(st.best)+"%":"–"}</div><div class="l">ดีที่สุด</div></div>
    <div class="kpi"><div class="v" style="color:${st.projection==null?"inherit":st.projection>=PASS?"var(--ok)":"var(--bad)"}">${st.projection==null?"–":r0(st.projection)+"%"}</div><div class="l">คาดการณ์สอบจริง</div></div>
    <div class="kpi"><div class="v">${passN}/${st.count}</div><div class="l">ครั้งที่ผ่านเกณฑ์</div></div>
    <div class="kpi"><div class="v">${st.totalQ}</div><div class="l">ข้อที่ทำทั้งหมด</div></div>
    <div class="kpi"><div class="v">${st.count? r0(st.avgSec):"–"}</div><div class="l">วินาที/ข้อ (เฉลี่ย)</div></div>
    <div class="kpi"><div class="v">${r0(totalMin)}</div><div class="l">นาทีที่ใช้รวม · ต่อเนื่อง ${st.streak} วัน</div></div>
  </div>
  ${st.count? `
  <div class="card pop"><h3>${ic("clock")} กิจกรรม 14 วันล่าสุด <small>จำนวนข้อ/วัน</small></h3>
    <div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px">${act.map(x=>`<div title="${x.d.toLocaleDateString("th-TH")}: ${x.n} ครั้ง ${x.q} ข้อ" style="display:grid;align-items:end;height:100%;text-align:center"><div style="height:${x.q? Math.max(6,x.q*80/mx):3}px;background:${x.q?"var(--pri)":"var(--soft)"};border-radius:6px"></div><span class="small muted">${x.d.getDate()}</span></div>`).join("")}</div></div>
  <div class="grid2">
    <div class="card pop"><h3>${ic("trend")} พัฒนาการ <small>คะแนน %</small></h3>${trendSVG(st.asc)}</div>
    <div class="card pop"><h3>${ic("star")} ความแม่นยำรายด้าน <small>10 ครั้งล่าสุด</small></h3>${radarSVG(st.dom)}</div>
  </div>
  <div class="card pop"><h3>${ic("list")} สรุปรายด้าน <small>ทุกครั้งที่ทำ</small></h3>${domBars(st.all)}</div>
  <div class="card pop"><h3>${ic("target")} รายหัวข้อ <small>เรียงจากอ่อนสุด · ข้อที่ผิดค้าง ${st.wrongIds.length} ข้อ</small></h3>
    <div class="tbl" style="max-height:340px"><table><tr><th>ด้าน</th><th>หัวข้อ</th><th>ถูก/ทำ</th><th>%</th></tr>
    ${topics.map(t=>`<tr class="${t.p<PASS?"bad":""}"><td><span class="dtag d${t.d}"><b>${t.d}</b></span></td><td>${esc(t.k)}</td><td>${t.c}/${t.t}</td><td><b>${r0(t.p)}%</b></td></tr>`).join("")}</table></div></div>
  <div class="card pop"><h3>${ic("file")} ประวัติทุกครั้ง <small>${atts.length} ครั้ง · กดแถวเพื่อดูเฉลยรายข้อ</small></h3>
    <div class="chips" id="af">${[["all","ทั้งหมด"],["p","ผ่าน"],["f","ไม่ผ่าน"],...Object.keys(MODE_TH).filter(m=>atts.some(a=>a.mode===m)).map(m=>["m:"+m,MODE_TH[m]])].map(([k,t],i)=>`<button class="chip ${i?"":"on"}" data-f="${k}">${t}</button>`).join("")}</div>
    <div class="tbl" style="max-height:480px"><table id="at"></table></div></div>` : ""}`;
  animateBars(v);
  $("#bk",v).onclick=()=>go("manage",{tab:"members"});
  if(!st.count) return;
  const draw=f=>{ const rows=atts.filter(a=>f==="all"||(f==="p"&&a.pct>=PASS)||(f==="f"&&a.pct<PASS)||(f.startsWith("m:")&&a.mode===f.slice(2)));
    $("#at",v).innerHTML=`<tr><th>วันเวลา</th><th>ชุด</th><th>รูปแบบ</th><th>คะแนน</th><th>ตอบ</th><th>เวลา</th>${DIDS.map(d=>`<th>ด.${d}</th>`).join("")}<th>ผล</th><th></th></tr>`+
    (rows.length? rows.map(a=>`<tr data-id="${a.id}" style="cursor:pointer" class="${a.pct>=PASS?"":"bad"}"><td style="white-space:nowrap">${fmtDate(a.createdAt)}</td><td>${esc(a.title)}</td><td>${esc(modeOf(a))}</td><td style="white-space:nowrap"><b>${a.correct}/${a.total}</b> (${r0(a.pct)}%)</td><td>${a.answered??"-"}/${a.total}</td><td style="white-space:nowrap">${fmtDur(a.durationSec||0)}${a.timeLimitMin?` / ${a.timeLimitMin} น.`:""}</td>${DIDS.map(d=>{ const x=a.byDomain?.[d]; return `<td>${x&&x.t? r0(x.c*100/x.t)+"%":"–"}</td>`; }).join("")}<td><span class="badge ${a.pct>=PASS?"ok":"bad"}">${a.pct>=PASS?"ผ่าน":"ไม่ผ่าน"}</span></td><td><button class="btn sm ghost" data-del="${a.id}" title="ลบ">${ic("x")}</button></td></tr>`).join("") : `<tr><td colspan="${8+DIDS.length}" class="muted">ไม่มีรายการ</td></tr>`);
    $$("#at tr[data-id]",v).forEach(tr=>tr.onclick=e=>{ if(e.target.closest("[data-del]")) return; const a=atts.find(x=>x.id===tr.dataset.id); go("result",{sum:a,uid:id,who:u.displayName}); });
    $$("#at [data-del]",v).forEach(b=>b.onclick=async()=>{ if(await confirmBox("ลบประวัติครั้งนี้?",`ลบผลสอบของ ${u.displayName} ครั้งนี้ถาวร`,"ลบ")){ try{ await S.store.deleteAttempt(id,b.dataset.del); toast("ลบแล้ว","ok"); go("member",{uid:id}); }catch(e){ toast(errMsg(e),"bad"); } } });
  };
  draw("all");
  $$("#af .chip",v).forEach(b=>b.onclick=()=>{ $$("#af .chip",v).forEach(x=>x.classList.toggle("on",x===b)); draw(b.dataset.f); });
  $("#csv",v).onclick=()=>{
    const q=x=>`"${String(x??"").replace(/"/g,'""')}"`;
    const head=["วันเวลา","ชุด","รูปแบบ","ถูก","ทั้งหมด","ตอบ","ร้อยละ","ผล","เวลา(นาที)","จำกัดเวลา(นาที)",...DIDS.map(d=>"ด้าน "+d+" (%)")];
    const lines=[head.map(q).join(",")].concat(atts.map(a=>[new Date(a.createdAt).toLocaleString("th-TH"),a.title,modeOf(a),a.correct,a.total,a.answered,r0(a.pct),a.pct>=PASS?"ผ่าน":"ไม่ผ่าน",r0((a.durationSec||0)/60),a.timeLimitMin||"",...DIDS.map(d=>{ const x=a.byDomain?.[d]; return x&&x.t? r0(x.c*100/x.t):""; })].map(q).join(",")));
    const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    const l=document.createElement("a"); l.href=URL.createObjectURL(blob); l.download=`ประวัติ_${u.username}.csv`; l.click(); setTimeout(()=>URL.revokeObjectURL(l.href),2000);
  };
};

/* ===================== boot ===================== */
function boot(){
  const wantLocal=window.FORCE_LOCAL || LS.get("hkt_mode",null)==="local";
  let store=null;
  if(!wantLocal && window.firebase){ try{ store=new FirebaseStore(); }catch(e){ console.error(e); } }
  if(!store){ store=new LocalStore(); if(!wantLocal && !window.firebase) setTimeout(()=>toast("เชื่อมต่อ Firebase ไม่ได้ ใช้โหมดทดลองในเครื่องแทน"),600); }
  S.store=store;
  $(".demo-pill").classList.toggle("hide",store.kind!=="local");
  store.onAuth(async u=>{
    S.user=u; S.bank=S.atts=S.exams=null; S.exam=null; stopTimer();
    if(!u){ S.view=null; $(".view",$("#view"))?.remove(); renderAuth(); return; }
    $("#auth")?.classList.add("hide"); $("#main").classList.remove("hide"); $(".bnav").classList.remove("hide");
    $("#brandOwl").innerHTML=owl("happy",OWL_COLORS[u.avatar||0],"");
    flushPending();
    const d=LS.get(draftKey(),null);
    go(d? "home" : "home");
  });
}

boot();
</script>
</body>
